# Project stages. Each stage follows docs/ai/workflow.yaml.
version: 1

stages:
  - id: 1
    name: agent-setup
    goal: Multi-agent workflow configured; no application code.
    definition_of_done:
      - .claude/agents/ contains plan-organizer, backend-architect, frontend-architect, plan-implementer, docs-and-tests, chore-runner, git-runner
      - Root CLAUDE.md with stack, roster, docs and git rules, stages, empty Decisions section
      - docs/ai/workflow.yaml, roadmap.yaml, conventions.yaml exist
      - docs/plans/.gitkeep exists
      - Committed as "chore: set up agent workflow (stage 1)"

  - id: 2
    name: base-structure
    status: done
    goal: Runnable skeleton — db + api + ui in docker compose with a seeded tree and a lazy-loading DBTreeView.
    definition_of_done:
      - "`docker compose up --build` starts db, api and ui"
      - UI calls the API; API reads from the seeded DB
      - Seed data has at least 4 levels of nesting
      - DBTreeView lazy-loads children on expand (never loads the whole tree)
      - Reset restores the database to the initial sample data
      - Backend integration tests (WebApplicationFactory + Testcontainers.PostgreSql) green
      - backend/CLAUDE.md and frontend/CLAUDE.md created

  - id: 3
    name: cache-core
    status: done
    goal: Local cache with correct hierarchy assembly and a transactional backend Apply endpoint.
    definition_of_done:
      - Selected DBTreeView node can be loaded into the cache
      - CachedTreeView assembles hierarchy correctly for nodes loaded in any order (child before parent, gaps, siblings)
      - Deleted state is displayed in CachedTreeView
      - "Backend Apply endpoint: single transactional batch of edits, adds (with temp ids, mapped to real ids in response) and deletes"
      - Deletes cascade to all descendants, including never-loaded ones
      - Tests for hierarchy assembly and Apply green

  - id: 4
    name: cache-pending-changes
    goal: Full pending-changes workflow in the cache, wired to Apply, with edge cases covered.
    definition_of_done:
      - Edit, add child, delete kept in cache only until Apply; cache touches DB only on load and apply
      - Temp ids for new nodes, including children of new nodes
      - Delete marks the node and all cached descendants as deleted
      - Deleted nodes are not editable (no edit/add/delete actions)
      - Apply wiring, temp-to-real id mapping and cache resync after Apply
      - "Edge case: node loaded after an ancestor was deleted is shown as deleted"
      - "Edge case: edits under a deleted ancestor are handled consistently"
      - Final README.md with one-command start, schema explanation and key decisions
      - All tests green

  - id: 5
    name: ui-update
    depends_on: [4]   # restyles the full stage 4 feature set; no new backend behaviour
    goal: Restyle the UI to the "Industry" design from the claude.ai design project, keeping all stage 2–4 behaviour.
    design_reference:
      source: https://claude.ai/design/p/c4013fb1-0341-440b-b446-4f41f68fe51a?file=Tree+Editor.dc.html
      local_copy: docs/design/stage-5/   # README.md (anatomy + rules), tree-editor.dc.html (mock), industry-styles.css (tokens)
    scope:
      in:
        - Industry tokens + component classes as the global stylesheet (Barlow / Barlow Condensed, steel accent, square blueprint frames with corner marks)
        - Header bar with brand and Reset; DB and Cache panels as blueprint sections; transfer gutter between them
        - Hairline tree rows (guides per depth, chevrons, leaf dot, '#id', cached marker, state tags new / edited / to delete / deleted)
        - Inline value editor in the cache row (Enter / Escape / blur)
        - Load into cache via button, double-click and drag-and-drop onto the cache panel
        - SVG link lines between a DB row and its cached copy
        - Collapsible network log of real API calls (method, path, status, duration)
        - Blueprint toasts; Apply dialog with itemised pending changes; Reset confirmation dialog
        - Motion from the mock (fly-in on load, FLIP on re-parent, flash tags) honouring prefers-reduced-motion
      out:
        - Row-style switcher (hairline / ledger / cells) — design-exploration control; ship hairline only
        - Simulated latency and the mock's in-memory API — the real API is used
        - Backend or API contract changes
    definition_of_done:
      - Frontend visually matches docs/design/stage-5 (layout, tokens, typography, blueprint frames, tags, dialogs, toasts, network log)
      - All colors / fonts / spacing come from Industry tokens; PrimeVue Aura look removed or fully overridden (frontend-architect decides and records it)
      - Every stage 2–4 DoD item still holds (lazy DB tree, hierarchy assembly, pending edits / adds / deletes until Apply, cascade, temp-id mapping, Reset)
      - Edit / Add child / Delete disabled for deleted and pending-delete nodes; Apply disabled with no pending changes
      - Drag-and-drop, double-click and button load all go through the single load-node API call
      - Network log lists every API request issued by the UI with status and duration
      - Keyboard focus uses the accent focus-visible ring; layout works down to 1024px wide
      - frontend/CLAUDE.md and README.md updated (design source, styling approach); `npm run build` and all tests green
