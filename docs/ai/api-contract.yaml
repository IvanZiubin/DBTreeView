# HTTP contract between backend (backend/) and frontend (frontend/). Owned by plan-organizer.
# Architects/implementers never edit this file; they report contract_changes_requested.
version: 2
stage_introduced: 2
changelog:
  - "v1 (stage 2): reads, reset, apply route returning 501."
  - "v2 (stage 3): apply implemented (501 removed); serialization of apply/reset; refreshIds rule; request limits; validation error keys; error precedence."
  - "v2 + client_rules (stage 4): no wire changes; added binding client_rules for the cache (refreshIds, pending-delete propagation, request building, failure handling)."

base_url:
  api_direct: http://localhost:8080        # api container, published port
  via_ui: http://localhost:3000/api        # nginx in ui container proxies /api/* -> http://api:8080/api/*
  dev: Vite dev server proxies /api -> http://localhost:8080 (same paths)
  note: All paths below are absolute and already include the /api prefix. No CORS — browser always talks same-origin.

conventions:
  content_type: application/json; charset=utf-8
  json_casing: camelCase
  ids: >
    Real node ids are 64-bit integers (PostgreSQL bigint, C# long, TS number). Ids are server-generated.
    Seed ids are fixed and deterministic (1..N in seed order); after Reset the id sequence restarts at N+1.
  temp_ids: >
    Client-generated string ids for nodes added in the cache and not yet applied. Format "tmp-<n>" (any
    non-empty string up to 64 chars is accepted). Unique within one apply request. Never sent as a path id.
  ordering: Lists of nodes (roots, children) are ordered by id ascending.
  soft_delete: >
    Nodes are never physically removed (except by Reset). Deleting sets isDeleted=true on the node and on
    ALL its descendants in the DB, including ones never loaded by any client. Deleted nodes are still
    returned by every read endpoint, with isDeleted=true. Parent–child relations never change.
  value_rules: value is a string; trimmed by the server; length after trim 1..200; otherwise 400.
  errors: >
    Every non-2xx response body is RFC 7807 ProblemDetails (application/problem+json) with at least
    type, title, status; detail where useful. Validation failures use ValidationProblemDetails
    (extra "errors" map: field -> string[]). Unhandled exceptions -> 500 ProblemDetails (no stack trace).
    Apply 404/409 bodies add a "nodeIds" extension (int64[], ascending) listing the offending ids.

schemas:
  Node:
    type: object
    required: [id, parentId, value, isDeleted, hasChildren]
    properties:
      id: { type: integer, format: int64 }
      parentId: { type: integer, format: int64, nullable: true, description: null for a root }
      value: { type: string }
      isDeleted: { type: boolean }
      hasChildren: { type: boolean, description: "true if at least one child row exists (deleted children count)" }

  NodeDetails:
    description: Node plus ancestry, used by the cache to place individually loaded nodes in the hierarchy.
    allOf: [Node]
    required: [ancestorIds]
    properties:
      ancestorIds:
        type: array
        items: { type: integer, format: int64 }
        description: "Ids of all ancestors ordered root -> parent. Empty array for a root. Last element == parentId."

  ApplyRequest:
    type: object
    required: [edits, adds, deletes]
    properties:
      edits:
        type: array
        items:
          type: object
          required: [id, value]
          properties:
            id: { type: integer, format: int64 }
            value: { type: string }
      adds:
        type: array
        description: >
          New nodes. Exactly one of parentId / parentTempId must be set. parentTempId must reference the
          tempId of another entry in this same adds array (children of new nodes). Order in the array is
          irrelevant; the server resolves dependencies. Cycles or unknown parentTempId -> 400.
        items:
          type: object
          required: [tempId, value]
          properties:
            tempId: { type: string }
            parentId: { type: integer, format: int64, nullable: true }
            parentTempId: { type: string, nullable: true }
            value: { type: string }
      deletes:
        type: array
        description: Real ids to soft-delete together with all their DB descendants. Temp nodes are never sent here (client drops them).
        items: { type: integer, format: int64 }
      refreshIds:
        type: array
        description: >
          Optional for the server; REQUIRED in practice for the client: the cache sends EVERY real id it holds
          (not only changed ones). The server never enumerates cascaded subtrees in the response, so this is the
          only way the client learns that cached descendants of a deleted node are now deleted. Ids that do not
          exist are silently ignored (no 404) — they are not part of the change set.
        items: { type: integer, format: int64 }

  ApplyResponse:
    type: object
    required: [idMap, nodes]
    properties:
      idMap:
        type: object
        additionalProperties: { type: integer, format: int64 }
        description: tempId -> newly assigned real id, one entry per adds item (key order = insert order, parents first; informational).
      nodes:
        type: array
        items: { $ref: NodeDetails }
        description: >
          Post-apply state of every node referenced by the request (edits ids, deletes ids, created nodes,
          refreshIds), de-duplicated, ordered by id. Nodes deleted by cascade that are in refreshIds come
          back with isDeleted=true.

apply_semantics:
  atomic: The whole request runs in one DB transaction; any error -> rollback, nothing persisted.
  order_of_operations: [adds (parents before children), edits, deletes with cascade]
  same_batch_rule: >
    Adds/edits targeting nodes that this same request deletes (directly or by cascade) are allowed;
    because deletes run last, those nodes end up deleted. Their ids still appear in idMap/nodes.
  conflicts: >
    Editing a node, adding under a parent, or deleting a node that is ALREADY deleted in the DB before
    the request -> 409. Exception: deleting an already-deleted node is idempotent (no error).
  not_found: Any referenced real id (edits, deletes, parentId) that does not exist -> 404, rollback.
  empty_request: All arrays empty -> 200 with empty idMap and nodes for refreshIds only.
  duplicates: >
    Duplicate ids in deletes are de-duplicated (no error). Duplicate ids in edits -> 400. Duplicate tempIds -> 400.
    Duplicate refreshIds are de-duplicated.
  limits: edits, adds and deletes each at most 1000 items; refreshIds at most 10000 items; otherwise 400.
  temp_id_rules: tempId non-empty, at most 64 chars, unique within adds; otherwise 400.
  error_precedence: >
    400 (body/shape/validation, checked before touching the DB) -> 404 (missing real id in edits, deletes,
    adds.parentId) -> 409 (already-deleted edit target or real add parent). First failure wins; nothing persisted.
  validation_error_keys: >
    ValidationProblemDetails.errors keys use the JSON path of the offending field, e.g. "edits[0].value",
    "adds[2].parentTempId", "adds[1].tempId", "deletes", "body". Messages are free text.
  concurrency: >
    Apply and Reset are serialized server-side (one transaction-scoped PostgreSQL advisory lock shared by both).
    A concurrent add under a node being cascade-deleted therefore either commits first (and is then deleted by
    the cascade) or runs after (and gets 409). The invariant "every descendant of a deleted node is deleted" always holds.
  hierarchy_note: >
    Parent–child relations never change, so ancestorIds of a node are stable for its lifetime (until Reset).

client_rules:
  description: >
    Binding rules for the cache client (frontend). No wire format impact; the server behaves as specified above
    regardless. Added in stage 4 to close stage-3 open risks 1 and 2 and the roadmap stage-4 edge cases.
  refresh_ids: >
    Every apply request sends refreshIds = every real (numeric) id held in the cache, ascending, including
    deleted and pending-delete nodes. After a 200, the client merges response.nodes so cached descendants of a
    cascade-deleted node show isDeleted=true immediately (no reload needed). (Closes stage-3 open risk 1.)
  pending_delete_propagation: >
    A node is "effectively deleted" in the cache when it isDeleted (server) or isPendingDelete (local).
    Deleting a node marks it and every cached descendant (ancestorIds contains its id) isPendingDelete.
    A node inserted into the cache (load) whose ancestorIds contain an effectively deleted cached node is
    inserted with isPendingDelete=true if that ancestor is pending-delete (server isDeleted already comes from
    the DB). The same check runs on re-load of an already cached node. (Closes stage-3 open risk 2.)
  no_actions_on_deleted: Edit, add child and delete are rejected (no-op) for effectively deleted nodes; the UI disables them.
  request_building: >
    deletes = ids of real nodes marked isPendingDelete whose nearest pending-delete ancestor is not also in
    deletes (sending only top-most is sufficient; sending all is also valid). Temp (isNew) nodes that are
    pending-delete, or under a pending-delete/deleted ancestor, are dropped and never sent in adds.
    edits = real nodes with isEdited, not isDeleted, and not isPendingDelete (an edit under a pending delete is
    discarded because the node ends deleted anyway; the server's same_batch_rule would give the same result).
    adds = remaining isNew nodes, parentId for a real parent or parentTempId for a temp parent.
  failure_handling: >
    On any non-2xx apply response the cache keeps all pending state unchanged (nothing persisted server-side,
    see apply_semantics.atomic) and shows the ProblemDetails title/detail. On 409/404 the nodeIds extension may
    be used to highlight offending nodes; the user can reload them to see the current DB state.
  reset: Reset clears the whole cache, including pending changes, and bumps the cache epoch (stage-3 race guard).

endpoints:
  - id: health
    method: GET
    path: /api/health
    description: Liveness + DB connectivity.
    responses:
      200: { body: '{ "status": "ok" }' }
      503: { body: ProblemDetails, when: database unreachable }

  - id: get-roots
    method: GET
    path: /api/nodes/roots
    responses:
      200: { body: "Node[]" }

  - id: get-children
    method: GET
    path: /api/nodes/{id}/children
    description: Direct children only (one level). Used by DBTreeView lazy expand.
    params: { id: int64 }
    responses:
      200: { body: "Node[] (empty array if no children)" }
      404: { body: ProblemDetails, when: node id does not exist }

  - id: get-node
    method: GET
    path: /api/nodes/{id}
    description: Single node with ancestorIds. Used when loading a node into the cache.
    params: { id: int64 }
    responses:
      200: { body: NodeDetails }
      404: { body: ProblemDetails, when: node id does not exist }

  - id: reset
    method: POST
    path: /api/reset
    description: >
      Restore the DB to the initial seed in one transaction (delete all rows, re-insert seed with its fixed
      ids, restart the id sequence after the max seed id). Takes the same advisory lock as apply.
      Client must also clear its cache.
    request: no body
    responses:
      200: { body: "Node[] — the roots after reset" }

  - id: apply
    method: POST
    path: /api/nodes/apply
    description: Apply pending cache changes in one transaction (see apply_semantics). Implemented in stage 3 (stage 2 returned 501).
    request: { body: ApplyRequest }
    responses:
      200: { body: ApplyResponse }
      400: { body: ValidationProblemDetails, when: "missing/invalid JSON body, invalid value, missing/both parent refs, unknown parentTempId, duplicate tempId or edit id, cycle, limits exceeded" }
      404: { body: ProblemDetails, when: referenced real id missing (edits, deletes, adds.parentId) }
      409: { body: ProblemDetails, when: edit target or real add parent already deleted before the request }
