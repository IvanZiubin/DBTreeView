  - id: 4
    owner: docs-and-tests
    title: README.md backend sections (final README)
    files:
      - { path: README.md, action: modify }
    instructions:
      - >-
        Write the backend-owned sections listed in readme_backend_outline below, in that order, merged with the frontend
