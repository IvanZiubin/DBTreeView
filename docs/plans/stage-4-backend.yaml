smoke:
  preconditions: "AC5 stack running; run from repo root in zsh; sequential, in this order"
  commands:
    - id: S1
      run: curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/reset
      expect_body: "200"
    - id: S2
      title: another client deletes 4 (cascade reaches 18 and 26)
      run: "curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/nodes/apply -H 'Content-Type: application/json' -d '{\"edits\":[],\"adds\":[],\"deletes\":[4]}'"
      expect_body: "200"
    - id: S3
      title: stale cache edits 26 and adds a temp chain under 18 -> 409
      run: "curl -s -i -X POST http://localhost:8080/api/nodes/apply -H 'Content-Type: application/json' -d '{\"edits\":[{\"id\":26,\"value\":\"x\"},{\"id\":2,\"value\":\"Books2\"}],\"adds\":[{\"tempId\":\"tmp-1\",\"parentId\":18,\"value\":\"A\"},{\"tempId\":\"tmp-2\",\"parentTempId\":\"tmp-1\",\"value\":\"B\"}],\"deletes\":[],\"refreshIds\":[2,18,26]}'"
      expect: 'status line "HTTP/1.1 409 Conflict"; body contains "nodeIds":[18,26]'
    - id: S4
      title: nothing persisted, no id consumed
      run: "docker compose exec -T db psql -U tree -d treeeditor -At -c \"SELECT count(*), max(id), (SELECT value FROM nodes WHERE id = 2) FROM nodes\""
      expect_body: "30|30|Books"
    - id: S5
      title: client-shaped batch after reloading (stale edits/adds dropped by the client), refresh shows cascade
      run: "curl -s -X POST http://localhost:8080/api/nodes/apply -H 'Content-Type: application/json' -d '{\"edits\":[{\"id\":2,\"value\":\"Books2\"}],\"adds\":[{\"tempId\":\"tmp-3\",\"parentId\":3,\"value\":\"After conflict\"}],\"deletes\":[],\"refreshIds\":[2,18,26]}'"
      expect_body: '{"idMap":{"tmp-3":31},"nodes":[{"id":2,"parentId":null,"value":"Books2","isDeleted":false,"hasChildren":true,"ancestorIds":[]},{"id":18,"parentId":10,"value":"Ultrabooks","isDeleted":true,"hasChildren":true,"ancestorIds":[1,4,10]},{"id":26,"parentId":18,"value":"Ultrabook 13-inch","isDeleted":true,"hasChildren":false,"ancestorIds":[1,4,10,18]},{"id":31,"parentId":3,"value":"After conflict","isDeleted":false,"hasChildren":false,"ancestorIds":[3]}]}'
    - id: S6
      run: "docker compose exec -T db psql -U tree -d treeeditor -At -c \"SELECT count(*) FROM nodes c JOIN nodes p ON p.id = c.parent_id WHERE p.is_deleted AND NOT c.is_deleted\""
      expect_body: "0"
    - id: S7
      run: curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/reset
      expect_body: "200 (leaves the stack at the seed)"
  notes:
    - Error bodies contain a non-deterministic traceId; that is why S3 uses "contains".

