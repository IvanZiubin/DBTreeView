# ---------------------------------------------------------------------------
# Test matrix — what the new tests cover (all implemented verbatim in steps 1–2).
# Existing tests already covering a scenario are listed under already_covered and must NOT be duplicated.
# ---------------------------------------------------------------------------
test_matrix:
  new:
    - path: backend/tests/TreeEditor.Api.Tests/Apply/ApplyClientFlowTests.cs
      class_invariant: "ApplyHttp.InvariantSql returns 0 after every test"
      cases:
        - name: Client_batch_with_deep_temp_chain_edits_topmost_delete_and_full_refresh
          covers: "V1, V2, V3, V4: edits [11,14]; 4-level temp chain under 2 sent deepest-first + sibling add under 11; top-most delete [10] only; refreshIds = all cached ids incl. pending-delete descendants 18,26,27"
          expect: "idMap tmp-1=31, tmp-5=32, tmp-2=33, tmp-3=34, tmp-4=35; nodes ids [1,2,4,7,10,11,14,18,26,27,31..35]; 10,18,26,27 deleted; 35 ancestorIds [2,31,33,34]; DB 35 rows, deleted = {10,18,19,26,27} (19 never loaded)"
        - name: Refresh_includes_nodes_deleted_by_an_earlier_apply_without_conflict
          covers: "V1: already-deleted cached ids (18, 26) in refreshIds -> returned, no 409; cascade continues over a partially deleted subtree"
          expect: "nodes [4,10,18,26] all deleted; DB deleted = {4,10,11,18,19,26,27}"
        - name: Stale_cache_changes_under_ancestor_deleted_by_another_client_are_409_and_persist_nothing
          covers: "V6, V7: other client's apply deletes 4; stale edit of 26 + temp chain under 18 + valid edit/add elsewhere"
          expect: "409, title Conflict, nodeIds [18,26]; DB 30 rows, node 2 'Books', node 26 'Ultrabook 13-inch'"
        - name: Stale_delete_of_node_already_cascade_deleted_by_another_client_succeeds
          covers: "V6: delete of a node already cascade-deleted elsewhere is idempotent and the rest of the batch applies"
          expect: "200; idMap tmp-1=31; nodes [2,26,31]; 26 deleted; 2 'Books2'"
        - name: Real_ids_from_idMap_are_used_by_the_next_apply
          covers: "V8: resync — real ids from idMap used for edit, add-under and delete in following applies"
          expect: "31,32 then 33 with ancestorIds [3,9,17,25,30,31,32]; delete 31 -> 31,32,33 deleted, 30 live"
        - name: Fifty_level_temp_chain_sent_deepest_first
          covers: "V3: arbitrary depth of temp chains, reverse order, ancestor CTE at depth 54"
          expect: "tmp-i = 31+i; node 80 parentId 79, 54 ancestorIds starting [3,9,17,25,30,31], last 79"
        - name: RefreshIds_at_the_10000_limit_is_accepted
          covers: "V1 limit boundary (10001 -> 400 is already covered)"
          expect: "200; 30 nodes, 14 deleted"
    - path: backend/tests/TreeEditor.Api.Tests/Apply/ApplyAtomicityTests.cs
      cases:
        - name: Rolled_back_adds_leave_a_sequence_gap
          covers: "V9 / stage-3 open risk 4: 500 after id allocation rolls back rows, not the sequence"
          expect: "500; next add gets 33; DB 31 rows; ids 31, 32 absent"
        - name: Validation_not_found_and_conflict_failures_consume_no_ids
          covers: "V9: 400/404/409 consume no ids"
          expect: "409, 404, 400, then next add gets 31"
  already_covered:   # do not duplicate
    - "Cascade to never-loaded descendants — ApplyCascadeTests.Delete_cascades_to_never_loaded_descendants"
    - "refreshIds show cascade of live cached descendants — ApplyCascadeTests.RefreshIds_show_cascade"
    - "Same-batch add/edit under a node deleted in the batch — ApplyCascadeTests.Same_batch_add_under_node_deleted_in_batch_is_deleted, Same_batch_edit_of_descendant_of_deleted_node"
    - "Idempotent / duplicate deletes — ApplyCascadeTests.Redelete_is_idempotent, Duplicate_delete_ids_are_deduplicated"
    - "2–3 level temp chains, breadth-first ids — ApplyHappyPathTests.Temp_id_chain_with_reversed_request_order, Three_level_chain_plus_sibling_uses_breadth_first_ids"
    - "Mixed batch of unrelated nodes — ApplyHappyPathTests.Mixed_batch_persists, Response_contains_all_referenced_ids_deduplicated_and_ordered"
    - "409 on directly deleted node / parent; 404 precedence; nothing persisted on 409 — ApplyErrorTests"
    - "Rollback on a late DB failure — ApplyAtomicityTests.Failure_in_later_operation_rolls_everything_back"
    - "Parallel add vs ancestor cascade, advisory lock — ApplyConcurrencyTests"
    - "Sequence restarts at 31 after Reset — ResetTests.Reset_removes_added_rows_and_restarts_identity_at_31, Reset_after_apply_restores_seed_and_sequence"
  must_pass_command: "cd backend && dotnet test TreeEditor.sln"

# ---------------------------------------------------------------------------
readme_backend_outline:
  order_note: Backend sections in this order; frontend sections (cache UI behaviour, frontend tests, styling) are inserted by the frontend plan.
  sections:
    - heading: "## Quick start"
      content:
        - "First bash block is exactly one line: `docker compose up --build`."
        - "Keep the services table (UI http://localhost:3000, API http://localhost:8080 also via http://localhost:3000/api, PostgreSQL localhost:5432 db treeeditor / user tree / password tree)."
        - "One sentence: on first start the API applies the EF migration and seeds the sample tree automatically (retrying until the DB is ready); the Reset button (POST /api/reset) restores it at any time."
        - "Keep the DB_PORT / API_PORT / UI_PORT override sentence."
    - heading: "## Tests"
      content:
        - "Keep the backend command `cd backend && dotnet test TreeEditor.sln` and the Docker/Testcontainers sentence."
        - "Add one sentence: integration tests cover reads, Reset, every Apply rule (validation, 404/409, cascade, atomic rollback, concurrency) and the stage-4 cache flows (client-shaped batches, stale cache 409, id mapping across applies)."
    - heading: "## API"
      content:
        - Keep the endpoint table and the contract link.
        - "Apply paragraph: keep it; add: order inside the transaction is adds (parents first) -> edits -> cascade deletes, so an edit/add under a node deleted in the same batch ends deleted."
        - "Add: the cache sends every real id it holds in `refreshIds`, so cascaded deletes of cached descendants come back in the same response (the server never enumerates whole subtrees)."
        - "Add: 409 means the cache is stale (another client deleted the node or an ancestor); nothing is persisted and `nodeIds` lists the offending ids; pending changes stay in the cache."
    - heading: "## Database schema"
      content:
        - "Keep the nodes table (id bigint identity by default, parent_id nullable FK fk_nodes_parent ON DELETE RESTRICT, value varchar(200) with ck_nodes_value_length 1..200 chars, is_deleted boolean)."
        - "Keep: ck_nodes_parent_not_self; index ix_nodes_parent_id_id on (parent_id, id) for lazy children ordered by id; trigger trg_nodes_parent_immutable (function nodes_parent_immutable) rejecting parent changes."
        - "Add subsection `### Writes and consistency`: Apply, Reset and the startup seed take the transaction-scoped advisory lock `pg_advisory_xact_lock(4242)` as their first statement, so tree writes are serialized; Apply also locks referenced rows with `SELECT ... FOR UPDATE`. Invariant: no live node has a deleted parent — check with `SELECT count(*) FROM nodes c JOIN nodes p ON p.id = c.parent_id WHERE p.is_deleted AND NOT c.is_deleted` (always 0)."
    - heading: "### Tree model"
      content:
        - "Keep the adjacency-list rationale; replace '(and, from stage 3, subtree soft-delete)' by 'and subtree soft-delete'."
        - "Add: adds under new (temp) nodes need only the parent's freshly allocated id, which is why adjacency list beats materialized path / closure table / nested sets here."
    - heading: "### Seed"
      content:
        - Keep as is (3 roots, 30 nodes, 5 levels, ids 1..30, SeedData.cs).
    - heading: "## Key decisions"
      content_backend_bullets:
        - "Soft delete with cascade (drop the 'Implemented by Apply (stage 3)' suffix)."
        - Immutable parent (trigger) -> stable ancestry for cache hierarchy assembly.
        - "Atomic Apply: one transaction, validation before any DB access, precedence 400 -> 404 -> 409, nothing persisted on any error."
        - "Set-based raw SQL for Apply (fixed number of round trips per batch; recursive CTEs for cascade and ancestors), EF Core for schema/migrations and simple reads."
        - "Serialized writes via advisory lock 4242 (Apply, Reset, seed)."
        - Reset semantics (keep existing bullet) and fixed seed ids (keep).
        - Same-origin /api proxy, no CORS (keep).
    - heading: "## Known behaviour"
      known_behaviour:
        text: |
          - Ids are never reused: an apply that fails after new ids were drawn (for example a database error, HTTP 500) rolls back its rows but not the id sequence, so later nodes skip those ids. Validation (400), not-found (404) and conflict (409) failures are detected before ids are drawn and leave no gap. Clients always use the `idMap` from the Apply response and never predict ids.
          - Reset restarts ids at 31, so ids are reused only across a Reset. Another open browser tab must reload its cache after a Reset made elsewhere.
          - One Apply accepts at most 1000 edits, 1000 adds and 1000 deletes, and at most 10000 `refreshIds`; larger requests get 400.

backend_claude_md_points:   # appended to backend/CLAUDE.md "## Conventions" by docs-and-tests (step 5)
  - "Stage 4 made no production backend change. Stage-4 client-flow tests live in tests/TreeEditor.Api.Tests/Apply/ApplyClientFlowTests.cs (requests shaped per api-contract client_rules); see test_matrix in docs/plans/stage-4-backend.yaml."
  - "Ids: identity sequence; 400/404/409 consume no ids (nextval runs after the 404/409 checks); a 500 after allocation leaves a sequence gap (tested in ApplyAtomicityTests); ids are reused only across Reset (restart at 31)."

claude_md_decision_line_optional: "Ids: identity sequence, never reused except across Reset; 400/404/409 consume no ids, a 500 after allocation leaves a gap (accepted) — docs/plans/stage-4-backend.md#decision-record-2--sequence-gaps-are-accepted-stage-3-open-risk-4"
tree_storage_summary: "Tree storage: adjacency list (nodes.parent_id, immutable via trigger) + recursive CTEs for ancestors / subtree soft-delete; index (parent_id, id) — unchanged in stage 4 (stage-2 DR1)"

