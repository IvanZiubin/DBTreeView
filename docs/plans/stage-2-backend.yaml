stage_3_notes:
  schema_changes_needed: none
  transaction: >
    Apply runs inside `await using var tx = await db.Database.BeginTransactionAsync(ct)`; first statement
    `SELECT pg_advisory_xact_lock(4242)` serializes concurrent Applies (prevents a concurrent add under a node
    whose ancestor is being cascade-deleted from escaping the cascade snapshot). Commit at end; any exception rolls back.
  checks: >
    Lock referenced rows with `SELECT id, is_deleted FROM nodes WHERE id = ANY(@ids) FOR UPDATE`; missing -> 404;
    edit target or real parent already deleted -> 409; delete of already-deleted node is a no-op.
  adds: Topologically order by parentTempId (cycle/unknown -> 400); insert parents first; capture generated ids into idMap.
  cascade_delete_sql: |
    WITH RECURSIVE subtree AS (
        SELECT n.id FROM nodes n WHERE n.id = ANY(@ids)
        UNION
        SELECT c.id FROM nodes c JOIN subtree s ON c.parent_id = s.id
    )
    UPDATE nodes SET is_deleted = TRUE
    WHERE id IN (SELECT id FROM subtree) AND is_deleted = FALSE;
  invariant: Every descendant of a deleted node is deleted (maintained by cascade + 409 on add under deleted parent).
  response: Reuse NodeQueries.GetNodeDetailsAsync for each referenced id (ordered by id, de-duplicated).

