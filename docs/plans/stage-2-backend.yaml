      - { path: backend/src/TreeEditor.Api/Program.cs, action: replace }
    instructions:
      - path: backend/src/TreeEditor.Api/Features/Health/HealthEndpoints.cs
        content: |
          using TreeEditor.Api.Data;
          using TreeEditor.Api.Infrastructure;

          namespace TreeEditor.Api.Features.Health;

          public sealed record HealthResponse(string Status);

          public static class HealthEndpoints
          {
              public static IEndpointRouteBuilder MapHealthEndpoints(this IEndpointRouteBuilder app)
              {
                  var group = app.MapGroup("/api");
                  group.MapGet("/health", GetHealthAsync);
                  return app;
              }

              private static async Task<IResult> GetHealthAsync(TreeDbContext db, CancellationToken ct)
              {
                  bool canConnect;
                  try
                  {
                      canConnect = await db.Database.CanConnectAsync(ct);
                  }
                  catch (Exception)
                  {
                      canConnect = false;
                  }

                  return canConnect
                      ? Results.Ok(new HealthResponse("ok"))
                      : Results.Problem(
                          statusCode: StatusCodes.Status503ServiceUnavailable,
                          title: "Service Unavailable",
                          detail: "The database is unreachable.",
                          type: ProblemTypes.ServiceUnavailable);
              }
          }
      - path: backend/src/TreeEditor.Api/Features/Nodes/NodeEndpoints.cs
        content: |
          using TreeEditor.Api.Data;

          namespace TreeEditor.Api.Features.Nodes;

          public static class NodeEndpoints
          {
              public static IEndpointRouteBuilder MapNodeEndpoints(this IEndpointRouteBuilder app)
              {
                  var group = app.MapGroup("/api/nodes");
                  group.MapGet("/roots", GetRootsAsync);
                  group.MapGet("/{id:long}/children", GetChildrenAsync);
                  group.MapGet("/{id:long}", GetNodeAsync);
                  return app;
              }

              private static async Task<IResult> GetRootsAsync(TreeDbContext db, CancellationToken ct) =>
                  Results.Ok(await NodeQueries.GetRootsAsync(db, ct));

              private static async Task<IResult> GetChildrenAsync(long id, TreeDbContext db, CancellationToken ct)
              {
                  if (!await NodeQueries.ExistsAsync(db, id, ct))
                  {
                      return NodeProblems.NotFound(id);
                  }

                  return Results.Ok(await NodeQueries.GetChildrenAsync(db, id, ct));
              }

              private static async Task<IResult> GetNodeAsync(long id, TreeDbContext db, CancellationToken ct)
              {
                  var node = await NodeQueries.GetNodeDetailsAsync(db, id, ct);
                  return node is null ? NodeProblems.NotFound(id) : Results.Ok(node);
              }
          }
      - path: backend/src/TreeEditor.Api/Features/Reset/ResetEndpoints.cs
        content: |
          using TreeEditor.Api.Data;
          using TreeEditor.Api.Features.Nodes;

          namespace TreeEditor.Api.Features.Reset;

          public static class ResetEndpoints
          {
              public static IEndpointRouteBuilder MapResetEndpoints(this IEndpointRouteBuilder app)
              {
                  var group = app.MapGroup("/api");
                  group.MapPost("/reset", ResetAsync);
                  return app;
              }

              private static async Task<IResult> ResetAsync(TreeSeeder seeder, TreeDbContext db, CancellationToken ct)
              {
                  await seeder.ResetAsync(ct);
                  return Results.Ok(await NodeQueries.GetRootsAsync(db, ct));
              }
          }
      - path: backend/src/TreeEditor.Api/Features/Apply/ApplyEndpoints.cs
        content: |
          using TreeEditor.Api.Infrastructure;

          namespace TreeEditor.Api.Features.Apply;

          public static class ApplyEndpoints
          {
              public static IEndpointRouteBuilder MapApplyEndpoints(this IEndpointRouteBuilder app)
              {
                  var group = app.MapGroup("/api/nodes");
                  group.MapPost("/apply", Apply);
                  return app;
              }

              // Stage 2 stub: the request body is intentionally not bound. Implemented in stage 3.
              private static IResult Apply() =>
                  Results.Problem(
                      statusCode: StatusCodes.Status501NotImplemented,
                      title: "Not Implemented",
                      detail: "POST /api/nodes/apply is implemented in stage 3.",
                      type: ProblemTypes.NotImplemented);
          }
      - path: backend/src/TreeEditor.Api/Program.cs
        content: |
          using System.Text.Json;
          using Microsoft.EntityFrameworkCore;
          using TreeEditor.Api.Data;
          using TreeEditor.Api.Features.Apply;
          using TreeEditor.Api.Features.Health;
          using TreeEditor.Api.Features.Nodes;
          using TreeEditor.Api.Features.Reset;

          var builder = WebApplication.CreateBuilder(args);

          builder.Services.AddProblemDetails();
          builder.Services.ConfigureHttpJsonOptions(options =>
          {
              options.SerializerOptions.PropertyNamingPolicy = JsonNamingPolicy.CamelCase;
          });

          // Connection string is resolved lazily so test hosts can override it via UseSetting.
          builder.Services.AddDbContext<TreeDbContext>((services, options) =>
          {
              var connectionString = services.GetRequiredService<IConfiguration>().GetConnectionString("Default")
                  ?? throw new InvalidOperationException("Connection string 'ConnectionStrings:Default' is not configured.");
              options.UseNpgsql(connectionString);
          });
          builder.Services.AddScoped<TreeSeeder>();

          var app = builder.Build();

          app.UseExceptionHandler();
          app.UseStatusCodePages();

          await DatabaseInitializer.InitializeAsync(app.Services, app.Lifetime.ApplicationStopping);

          app.MapHealthEndpoints();
          app.MapNodeEndpoints();
          app.MapResetEndpoints();
          app.MapApplyEndpoints();

          app.Run();

          public partial class Program
          {
          }
