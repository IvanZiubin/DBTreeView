    title: Generate the initial EF Core migration and add the parent-immutability trigger
    files:
      - { path: "backend/src/TreeEditor.Api/Data/Migrations/<timestamp>_InitialCreate.cs", action: "generate, then modify" }
      - { path: "backend/src/TreeEditor.Api/Data/Migrations/<timestamp>_InitialCreate.Designer.cs", action: generate }
      - { path: backend/src/TreeEditor.Api/Data/Migrations/TreeDbContextModelSnapshot.cs, action: generate }
    instructions:
      - run_from: /Users/maczone/Desktop/personal/test_qit/backend
        commands:
          - dotnet tool restore
          - dotnet ef migrations add InitialCreate --project src/TreeEditor.Api/TreeEditor.Api.csproj --startup-project src/TreeEditor.Api/TreeEditor.Api.csproj --output-dir Data/Migrations
        note: No database connection is needed for this command. Do not run `dotnet ef database update`.
      - edit: >
          Open the single file matching backend/src/TreeEditor.Api/Data/Migrations/*_InitialCreate.cs
          (NOT the .Designer.cs). Verify the generated Up() creates table "nodes" with columns id (bigint,
          identity by default), parent_id (bigint, nullable), value (character varying(200)), is_deleted
          (boolean), primary key pk_nodes, foreign key fk_nodes_parent (ReferentialAction.Restrict), check
          constraints ck_nodes_parent_not_self and ck_nodes_value_length, and index ix_nodes_parent_id_id.
          If any of these is missing, stop and report (do not hand-fix).
      - edit_up: "Append, as the LAST statement inside Up(MigrationBuilder migrationBuilder) (after the CreateIndex call), exactly:"
        code: |
          migrationBuilder.Sql("""
              CREATE FUNCTION nodes_parent_immutable() RETURNS trigger
              LANGUAGE plpgsql AS $$
              BEGIN
                  IF NEW.parent_id IS DISTINCT FROM OLD.parent_id THEN
                      RAISE EXCEPTION 'nodes.parent_id is immutable (node %)', OLD.id
                          USING ERRCODE = 'check_violation';
                  END IF;
                  RETURN NEW;
              END;
              $$;
              """);

          migrationBuilder.Sql("""
              CREATE TRIGGER trg_nodes_parent_immutable
              BEFORE UPDATE OF parent_id ON nodes
              FOR EACH ROW EXECUTE FUNCTION nodes_parent_immutable();
              """);
      - edit_down: "Insert, as the FIRST statements inside Down(MigrationBuilder migrationBuilder) (before DropTable), exactly:"
        code: |
          migrationBuilder.Sql("DROP TRIGGER IF EXISTS trg_nodes_parent_immutable ON nodes;");
          migrationBuilder.Sql("DROP FUNCTION IF EXISTS nodes_parent_immutable();");
      - verify_commands:
