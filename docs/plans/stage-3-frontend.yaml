  - id: S2
    title: Pure cache model module
    files:
      - { path: frontend/src/cache/model.ts, action: create }
    content: |
      // Pure cache model (no Vue/Pinia imports). Re-exported by src/stores/cache.ts.

      /** Real ids are numbers; temp ids (nodes added in the cache, not yet applied) are strings "tmp-<n>". */
      export type CacheId = number | string

      export interface CachedNode {
        id: CacheId
        /** Direct parent id (null for a DB root). Display parent is derived, see src/cache/hierarchy.ts. */
        parentId: CacheId | null
        /** Current (possibly edited) value. */
        value: string
        /** Value as last loaded from / applied to the DB ('' for new nodes). */
        originalValue: string
        /** Deleted state in the DB as of the last load/apply. */
        isDeleted: boolean
        /** DB hasChildren as of the last load/apply (false for new nodes). */
        hasChildren: boolean
        /** Added in the cache, not yet applied (id is a temp id). */
        isNew: boolean
        /** Value edited in the cache, not yet applied. */
        isEdited: boolean
        /** Marked deleted in the cache (directly or by cascade), not yet applied. */
        isPendingDelete: boolean
        /** Ancestor ids ordered root -> parent ([] for a root). May contain temp ids for new nodes. */
        ancestorIds: CacheId[]
      }

      /** Map key for a cache id: String(id). Real "42" and temp "tmp-1" never collide. */
      export function cacheKey(id: CacheId): string {
        return String(id)
      }

      /** `data` of every PrimeVue TreeNode produced by buildCacheTree. */
      export interface CacheTreeNodeData {
        node: CachedNode
        /**
         * Ancestors that are not cached between the row this node is displayed under and the node itself,
         * ordered root -> parent. For a top-level row: all its ancestorIds. Empty when the display parent is the
         * direct parent, or when the node is a DB root.
         */
        missingAncestorIds: CacheId[]
      }
    done_when: File matches content.

  - id: S3
    title: Pure hierarchy assembly
    files:
      - { path: frontend/src/cache/hierarchy.ts, action: create }
    content: |
      // Pure hierarchy assembly for CachedTreeView (no Vue/Pinia imports). See docs/plans/stage-3-frontend.md DR-FE-3.1.
      import type { TreeNode } from 'primevue/treenode'
      import { cacheKey, type CacheId, type CachedNode, type CacheTreeNodeData } from './model'

      const TEMP_ID_PATTERN = /^tmp-(\d+)$/

      /** Sibling order: real ids ascending, then temp ids "tmp-<n>" by n (creation order), then other strings. */
      export function compareCacheIds(a: CacheId, b: CacheId): number {
        if (typeof a === 'number' && typeof b === 'number') {
          return a - b
        }
        if (typeof a === 'number') {
          return -1
        }
        if (typeof b === 'number') {
          return 1
        }
        const matchA = TEMP_ID_PATTERN.exec(a)
        const matchB = TEMP_ID_PATTERN.exec(b)
        if (matchA && matchB) {
          return Number(matchA[1]) - Number(matchB[1])
        }
        if (matchA) {
          return -1
        }
        if (matchB) {
          return 1
        }
        return a < b ? -1 : a > b ? 1 : 0
      }

      export interface Placement {
        /** Key of the nearest cached ancestor, or null when no ancestor is cached (top-level row). */
        parentKey: string | null
        /** Uncached ancestors between the display parent (or the top) and the node, ordered root -> parent. */
        missingAncestorIds: CacheId[]
      }

      /** Finds the nearest cached ancestor by scanning ancestorIds from the parent end towards the root. */
      export function placeNode(node: CachedNode, isCached: (key: string) => boolean): Placement {
        const ancestors = node.ancestorIds
        for (let i = ancestors.length - 1; i >= 0; i -= 1) {
          const ancestorKey = cacheKey(ancestors[i])
          if (isCached(ancestorKey)) {
            return { parentKey: ancestorKey, missingAncestorIds: ancestors.slice(i + 1) }
          }
        }
        return { parentKey: null, missingAncestorIds: ancestors.slice() }
      }

      /**
       * Assembles cached nodes (any order, any gaps) into PrimeVue TreeNodes. Each node is displayed under its
       * nearest cached ancestor; nodes without a cached ancestor are top-level. Siblings sorted by compareCacheIds.
       * TreeNode: { key: cacheKey(id), label: value, leaf: no displayed children, children, data: CacheTreeNodeData }.
       */
      export function buildCacheTree(nodes: readonly CachedNode[]): TreeNode[] {
        const cachedKeys = new Set<string>()
        for (const node of nodes) {
          cachedKeys.add(cacheKey(node.id))
        }

        const childrenByParent = new Map<string | null, CachedNode[]>()
        const placements = new Map<string, Placement>()
        for (const node of nodes) {
          const key = cacheKey(node.id)
          const placement = placeNode(node, (candidate) => candidate !== key && cachedKeys.has(candidate))
          placements.set(key, placement)
          const siblings = childrenByParent.get(placement.parentKey)
          if (siblings) {
            siblings.push(node)
          } else {
            childrenByParent.set(placement.parentKey, [node])
          }
        }

        const visited = new Set<string>()

        function build(parentKey: string | null): TreeNode[] {
          const group = (childrenByParent.get(parentKey) ?? []).slice().sort((a, b) => compareCacheIds(a.id, b.id))
          const result: TreeNode[] = []
          for (const node of group) {
            const key = cacheKey(node.id)
            if (visited.has(key)) {
              continue
            }
            visited.add(key)
            const children = build(key)
            const data: CacheTreeNodeData = {
              node,
              missingAncestorIds: placements.get(key)?.missingAncestorIds ?? [],
            }
            result.push({ key, label: node.value, leaf: children.length === 0, children, data })
          }
          return result
        }

        return build(null)
      }

      /** Tooltip / aria-label of the gap marker, e.g. "3 level(s) not loaded: #4, #10, #18". */
      export function gapTooltip(missingAncestorIds: readonly CacheId[]): string {
        const ids = missingAncestorIds.map((id) => `#${id}`).join(', ')
        return `${missingAncestorIds.length} level(s) not loaded: ${ids}`
      }
    done_when: File matches content.

  - id: S4
    title: Cache store — load, refresh, hierarchy, expansion, realIds
    files:
      - { path: frontend/src/stores/cache.ts, action: replace }
    content: |
      import { defineStore } from 'pinia'
      import { computed, ref } from 'vue'
      import type { TreeNode } from 'primevue/treenode'
      import type { NodeDetails } from '../api/types'
      import { buildCacheTree } from '../cache/hierarchy'
      import { cacheKey, type CacheId, type CachedNode } from '../cache/model'

      // Re-exported so components keep importing cache types from the store module.
      export { cacheKey }
      export type { CacheId, CachedNode }

      export const useCacheStore = defineStore('cache', () => {
        /** All cached nodes keyed by cacheKey(id). Flat: the hierarchy is derived in treeNodes, never stored. */
        const nodes = ref<Record<string, CachedNode>>({})
        const selectedKey = ref<string | null>(null)
        /** PrimeVue Tree expandedKeys. New nodes start expanded; user collapse removes keys. Always replaced, never mutated. */
        const expandedKeys = ref<Record<string, boolean>>({})
        const nextTempSeq = ref(1)
        const applying = ref(false)
        /** Incremented by clear(); callers discard getNode responses that started in an older epoch (Reset race). */
        const epoch = ref(0)

        const nodeList = computed<CachedNode[]>(() => Object.values(nodes.value))

        const isEmpty = computed<boolean>(() => Object.keys(nodes.value).length === 0)

        const selectedNode = computed<CachedNode | null>(() =>
          selectedKey.value === null ? null : (nodes.value[selectedKey.value] ?? null),
        )

        const hasPendingChanges = computed<boolean>(() =>
          nodeList.value.some((n) => n.isNew || n.isEdited || n.isPendingDelete),
        )

        /** Every real (numeric) id in the cache, ascending. Stage 4 apply sends this as refreshIds (contract v2). */
        const realIds = computed<number[]>(() =>
          nodeList.value.flatMap((n) => (typeof n.id === 'number' ? [n.id] : [])).sort((a, b) => a - b),
        )

        /** Hierarchy assembled from cached nodes: nearest cached ancestor (src/cache/hierarchy.ts). */
        const treeNodes = computed<TreeNode[]>(() => buildCacheTree(nodeList.value))

        function expandKeys(keys: readonly string[]): void {
          const next: Record<string, boolean> = { ...expandedKeys.value }
          for (const key of keys) {
            next[key] = true
          }
          expandedKeys.value = next
        }

        /**
         * Inserts unknown nodes, refreshes known ones. Refresh overwrites only server fields (parentId, ancestorIds,
         * originalValue, isDeleted, hasChildren) and value only when not isEdited; isNew/isEdited/isPendingDelete are
         * never touched. Newly inserted nodes are added to expandedKeys. Used by loadNode and by stage-4 apply.
         */
        function mergeServerNodes(serverNodes: readonly NodeDetails[]): void {
          const inserted: string[] = []
          for (const details of serverNodes) {
            const key = cacheKey(details.id)
            const existing = nodes.value[key]
            if (existing) {
              existing.parentId = details.parentId
              existing.ancestorIds = details.ancestorIds.slice()
              existing.originalValue = details.value
              existing.isDeleted = details.isDeleted
              existing.hasChildren = details.hasChildren
              if (!existing.isEdited) {
                existing.value = details.value
              }
            } else {
              nodes.value[key] = {
                id: details.id,
                parentId: details.parentId,
                value: details.value,
                originalValue: details.value,
                isDeleted: details.isDeleted,
                hasChildren: details.hasChildren,
                isNew: false,
                isEdited: false,
                isPendingDelete: false,
                ancestorIds: details.ancestorIds.slice(),
              }
              inserted.push(key)
            }
          }
          if (inserted.length > 0) {
            expandKeys(inserted)
          }
        }

        /** Loads one node from GET /api/nodes/{id}: merge, expand its cached ancestors (reveal), select it. */
        function loadNode(details: NodeDetails): void {
          mergeServerNodes([details])
          const cachedAncestorKeys = details.ancestorIds
            .map((ancestorId) => cacheKey(ancestorId))
            .filter((key) => key in nodes.value)
          if (cachedAncestorKeys.length > 0) {
            expandKeys(cachedAncestorKeys)
          }
          selectedKey.value = cacheKey(details.id)
        }

        /** TODO stage 4: change value of a non-deleted node; mark isEdited. */
        function editValue(_id: CacheId, _value: string): void {
          // Intentionally empty until stage 4.
        }

        /**
         * TODO stage 4: add a child with temp id `tmp-${nextTempSeq}` under a non-deleted node;
         * ancestorIds = [...parent.ancestorIds, parent.id]; expand parent and new key via expandKeys.
         */
        function addChild(_parentId: CacheId, _value: string): void {
          // Intentionally empty until stage 4.
        }

        /** TODO stage 4: mark the node and all cached descendants (ancestorIds contains id) as pending-deleted. */
        function deleteNode(_id: CacheId): void {
          // Intentionally empty until stage 4.
        }

        /**
         * TODO stage 4: build ApplyRequest with refreshIds = realIds.value, call applyChanges, re-key temp ids via
         * idMap (also inside ancestorIds/parentId/selectedKey/expandedKeys), clear pending flags of applied nodes,
         * then mergeServerNodes(response.nodes).
         */
        async function apply(): Promise<void> {
          // Intentionally empty until stage 4.
        }

        /** Empties the cache (used by Reset) and starts a new epoch. */
        function clear(): void {
          nodes.value = {}
          selectedKey.value = null
          expandedKeys.value = {}
          nextTempSeq.value = 1
          applying.value = false
          epoch.value += 1
        }

        return {
          nodes,
          selectedKey,
          expandedKeys,
          nextTempSeq,
          applying,
          epoch,
          nodeList,
          isEmpty,
          selectedNode,
          hasPendingChanges,
          realIds,
          treeNodes,
          mergeServerNodes,
          loadNode,
          editValue,
          addChild,
          deleteNode,
          apply,
          clear,
        }
      })
    done_when: File matches content.

