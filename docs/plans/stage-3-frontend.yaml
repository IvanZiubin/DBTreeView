test_matrix:
  owner: docs-and-tests (workflow test phase); implementer only writes the S8 smoke test
  conventions:
    - Files - src/cache/hierarchy.test.ts (extend the S8 file; keep the smoke test) and src/stores/cache.test.ts (new).
    - Explicit imports from 'vitest' (describe, it, expect, beforeEach); no globals; Node environment; no jsdom, no component mounting.
    - Store tests call setActivePinia(createPinia()) in beforeEach (import from 'pinia') and feed NodeDetails literals to loadNode / mergeServerNodes. No network: never call client functions.
    - Seed-shaped fixtures (ids and ancestorIds from backend SeedData) - 1 [], 2 [], 3 [], 4 [1], 5 [1], 10 [1,4], 18 [1,4,10], 26 [1,4,10,18], 27 [1,4,10,18].
    - Test files must type-check under tsconfig.app.json strict rules (npm run build).
  hierarchy_cases:   # buildCacheTree / placeNode / compareCacheIds / gapTooltip
    - { id: H1, case: "child before parent", given: "nodes [4, 1]", expect: "one top-level key '1' with child '4'; '4' missingAncestorIds []" }
    - { id: H2, case: "parent before child", given: "nodes [1, 4]", expect: "same tree as H1 (input order irrelevant)" }
    - { id: H3, case: "gap: grandparent + grandchild only", given: "nodes [1, 10]", expect: "'10' under '1' with missingAncestorIds [4]; gapTooltip -> '1 level(s) not loaded: #4'" }
    - { id: H4, case: "deep gap and later fill (26,1,10 order)", given: "nodes [26, 1, 10]", expect: "1 > 10 > 26; missing [4] on 10, [18] on 26 (smoke test)" }
    - { id: H5, case: "top-level non-root shows full gap", given: "nodes [26]", expect: "top-level '26', missingAncestorIds [1,4,10,18]; gapTooltip '4 level(s) not loaded: #1, #4, #10, #18'" }
    - { id: H6, case: "DB root has no gap", given: "nodes [1]", expect: "missingAncestorIds []" }
    - { id: H7, case: "siblings ordered by id asc", given: "nodes [5, 1, 4]", expect: "children of '1' are ['4','5']" }
    - { id: H8, case: "multiple roots ordered", given: "nodes [3, 1, 2]", expect: "top-level keys ['1','2','3']" }
    - { id: H9, case: "unrelated subtrees with gaps", given: "nodes [26, 2]", expect: "top-level ['2','26'] (sorted by id), 26 keeps full gap" }
    - { id: H10, case: "temp ids after real ids, creation order", given: "children of 1 - real 5, 4 and temp 'tmp-10','tmp-2' (ancestorIds [1])", expect: "order ['4','5','tmp-2','tmp-10']" }
    - { id: H11, case: "temp child of temp node", given: "1, tmp-1 (anc [1]), tmp-2 (anc [1,'tmp-1'])", expect: "1 > tmp-1 > tmp-2, no gaps" }
    - { id: H12, case: "leaf flag", given: "nodes [1, 4]", expect: "'1'.leaf false, '4'.leaf true" }
    - { id: H13, case: "data references the cached node", given: "any", expect: "TreeNode.data.node is the same object passed in; label equals node.value; key equals String(id)" }
    - { id: H14, case: "compareCacheIds", given: "(3,10),(10,'tmp-1'),('tmp-2','tmp-10'),('tmp-1','x')", expect: "negative in all four cases" }
    - { id: H15, case: "empty input", given: "[]", expect: "[]" }
  store_cases:   # useCacheStore
    - { id: C1, case: "loadNode inserts", given: "loadNode(details 1)", expect: "nodes['1'] has value=originalValue, server flags copied, isNew/isEdited/isPendingDelete false; isEmpty false; selectedKey '1'; expandedKeys['1'] true" }
    - { id: C2, case: "treeNodes uses hierarchy", given: "loadNode 26, then 1, then 10", expect: "treeNodes is 1 > 10 > 26 (re-parented automatically)" }
    - { id: C3, case: "reload refreshes server fields", given: "loadNode 1 (value A); loadNode 1 again with value B, isDeleted true, hasChildren false", expect: "single entry; value B, originalValue B, isDeleted true, hasChildren false" }
    - { id: C4, case: "reload keeps pending flags and edited value", given: "loadNode 1; set nodes['1'].isEdited=true, value='Local', isPendingDelete=true; loadNode 1 with value 'Server'", expect: "value 'Local', originalValue 'Server', isEdited true, isPendingDelete true, isNew unchanged" }
    - { id: C5, case: "mergeServerNodes batch", given: "mergeServerNodes([1, 4, 10]) on empty cache", expect: "3 nodes, all keys in expandedKeys, selectedKey unchanged (null)" }
    - { id: C6, case: "user collapse respected on refresh/unrelated load", given: "loadNode 1, 4; expandedKeys = {'4': true} (simulated collapse of 1); loadNode 2", expect: "expandedKeys['1'] still absent; '2' true" }
    - { id: C7, case: "load reveals cached ancestors", given: "loadNode 1, 4; expandedKeys = {}; loadNode 10", expect: "expandedKeys has '1', '4', '10' true; selectedKey '10'" }
    - { id: C8, case: "deleted display flags", given: "loadNode 10 with isDeleted true", expect: "treeNodes row data.node.isDeleted true (renders deleted); a node with isPendingDelete true set manually also has data.node.isPendingDelete true" }
    - { id: C9, case: "realIds", given: "loadNode 10, 1, 4; insert nodes['tmp-1'] manually with id 'tmp-1'", expect: "realIds equals [1, 4, 10]" }
    - { id: C10, case: "clear (Reset)", given: "loadNode 1, 4; record epoch; clear()", expect: "isEmpty true; treeNodes []; selectedKey null; expandedKeys {}; nextTempSeq 1; epoch incremented by 1; realIds []" }
    - { id: C11, case: "hasPendingChanges", given: "loadNode 1", expect: "false; true after setting nodes['1'].isEdited = true" }
    - { id: C12, case: "selectedNode", given: "loadNode 1, then selectedKey = '999'", expect: "selectedNode is nodes['1'] after load; null for unknown key" }

