conventions_for_implementer:
  - Node commands always use the nvm prefix shown at the top of this file.
  - tsconfig has strict, noUnusedLocals, noUnusedParameters, erasableSyntaxOnly, verbatimModuleSyntax, lib ES2020+DOM. No enums, no parameter properties, `import type` / inline `type` for types, `_` prefix for unused stub params, no ES2022+ array methods (no toSorted/at/findLast).
  - Relative imports only (no `@/` alias).
  - All HTTP goes through src/api/client.ts. No other file calls fetch.
  - src/cache/*.ts (except *.test.ts) must not import from 'vue', 'pinia' or any component — they are pure modules.
  - File contents given under `content` are to be written exactly (whitespace may differ only in trailing newline).
  - Do not modify package.json, tsconfig*.json, or files not listed in steps (package.json is changed only by prerequisites P2/P3).

