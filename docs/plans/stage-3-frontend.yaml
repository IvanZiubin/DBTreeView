  - id: S6
    title: DbTreeView — real Load into cache (placeholder toast removed)
    files:
      - { path: frontend/src/components/DbTreeView.vue, action: replace }
    content: |
      <script setup lang="ts">
      import { onMounted, ref } from 'vue'
      import Button from 'primevue/button'
      import Tree from 'primevue/tree'
      import type { TreeNode } from 'primevue/treenode'
      import NodeLabel from './NodeLabel.vue'
      import { getNode } from '../api/client'
      import type { Node } from '../api/types'
      import { reportError } from '../errors'
      import { useCacheStore } from '../stores/cache'
      import { useDbTreeStore } from '../stores/dbTree'

      const dbTree = useDbTreeStore()
      const cache = useCacheStore()
      const loadingIntoCache = ref(false)

      onMounted(async () => {
        try {
          await dbTree.loadRoots()
        } catch (err) {
          reportError(err)
        }
      })

      async function onNodeExpand(node: TreeNode): Promise<void> {
        try {
          await dbTree.loadChildren(node.key)
        } catch (err) {
          reportError(err)
        }
      }

      /** GET /api/nodes/{id} -> cache.loadNode. No success toast: the node is selected and revealed in the cache. */
      async function onLoadIntoCache(): Promise<void> {
        const id = dbTree.selectedId
        if (id === null) {
          return
        }
        const startedEpoch = cache.epoch
        loadingIntoCache.value = true
        try {
          const details = await getNode(id)
          if (startedEpoch !== cache.epoch) {
            return
          }
          cache.loadNode(details)
        } catch (err) {
          reportError(err)
        } finally {
          loadingIntoCache.value = false
        }
      }

      function nodeData(node: TreeNode): Node {
        return node.data as Node
      }
      </script>

      <template>
        <section class="tree-panel" data-testid="db-tree-view">
          <header class="tree-panel__header">
            <h2 class="tree-panel__title">Database</h2>
            <Button
              label="Load into cache"
              icon="pi pi-download"
              size="small"
              :disabled="dbTree.selectedId === null || loadingIntoCache"
              :loading="loadingIntoCache"
              data-testid="load-into-cache"
              @click="onLoadIntoCache"
            />
          </header>
          <div class="tree-panel__body">
            <Tree
              v-model:selection-keys="dbTree.selectionKeys"
              v-model:expanded-keys="dbTree.expandedKeys"
              :value="dbTree.roots"
              selection-mode="single"
              :meta-key-selection="false"
              loading-mode="icon"
              :loading="dbTree.rootsLoading"
              class="tree-panel__tree"
              @node-expand="onNodeExpand"
            >
              <template #default="{ node }">
                <NodeLabel :value="nodeData(node).value" :deleted="nodeData(node).isDeleted" />
              </template>
            </Tree>
            <p v-if="!dbTree.rootsLoading && dbTree.roots.length === 0" class="tree-panel__empty">
              No nodes in the database.
            </p>
          </div>
        </section>
      </template>
    done_when: File matches content.

  - id: S7
    title: CachedTreeView — assembled tree, selection, expansion, gap marker, deleted style
    files:
      - { path: frontend/src/components/CachedTreeView.vue, action: replace }
    content: |
      <script setup lang="ts">
      import { computed } from 'vue'
      import Button from 'primevue/button'
      import Tree from 'primevue/tree'
      import type { TreeNode } from 'primevue/treenode'
      import NodeLabel from './NodeLabel.vue'
      import { gapTooltip } from '../cache/hierarchy'
      import type { CacheTreeNodeData } from '../cache/model'
      import { useCacheStore } from '../stores/cache'

      const cache = useCacheStore()

      /** Bridges PrimeVue single-selection keys to cache.selectedKey. */
      const selectionKeys = computed<Record<string, boolean>>({
        get: () => (cache.selectedKey === null ? {} : { [cache.selectedKey]: true }),
        set: (keys) => {
          const key = Object.keys(keys).find((k) => keys[k])
          cache.selectedKey = key ?? null
        },
      })

      function rowData(node: TreeNode): CacheTreeNodeData {
        return node.data as CacheTreeNodeData
      }
      </script>

      <template>
        <section class="tree-panel" data-testid="cached-tree-view">
          <header class="tree-panel__header">
            <h2 class="tree-panel__title">Cache</h2>
            <!-- TODO stage 4: enable actions for the selected non-deleted node and Apply when there are pending changes. -->
            <div class="tree-panel__toolbar">
              <Button label="Edit" icon="pi pi-pencil" size="small" severity="secondary" disabled data-testid="cache-edit" />
              <Button label="Add child" icon="pi pi-plus" size="small" severity="secondary" disabled data-testid="cache-add-child" />
              <Button label="Delete" icon="pi pi-trash" size="small" severity="danger" disabled data-testid="cache-delete" />
              <Button label="Apply" icon="pi pi-check" size="small" severity="success" disabled data-testid="cache-apply" />
            </div>
          </header>
          <div class="tree-panel__body">
            <p v-if="cache.isEmpty" class="tree-panel__empty" data-testid="cache-empty">
              The cache is empty. Select a node in the database tree and click “Load into cache”.
            </p>
            <Tree
              v-else
              v-model:selection-keys="selectionKeys"
              v-model:expanded-keys="cache.expandedKeys"
              :value="cache.treeNodes"
              selection-mode="single"
              :meta-key-selection="false"
              class="tree-panel__tree"
              data-testid="cache-tree"
            >
              <template #default="{ node }">
                <span class="cache-row" :data-testid="`cache-node-${node.key}`">
                  <span
                    v-if="rowData(node).missingAncestorIds.length > 0"
                    class="cache-row__gap"
                    :title="gapTooltip(rowData(node).missingAncestorIds)"
                    :aria-label="gapTooltip(rowData(node).missingAncestorIds)"
                    :data-gap-depth="rowData(node).missingAncestorIds.length"
                    data-testid="cache-gap-marker"
                  >…</span>
                  <NodeLabel
                    :value="rowData(node).node.value"
                    :deleted="rowData(node).node.isDeleted || rowData(node).node.isPendingDelete"
                  />
                </span>
              </template>
            </Tree>
          </div>
        </section>
      </template>

      <style scoped>
      .cache-row {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
      }

      .cache-row__gap {
        padding: 0 0.3rem;
        border: 1px dashed var(--p-content-border-color);
        border-radius: 4px;
        color: var(--p-text-muted-color);
        font-size: 0.8rem;
        line-height: 1.3;
        cursor: help;
      }
      </style>
    done_when: File matches content.

  - id: S8
    title: Vitest smoke test (proves the runner; docs-and-tests extends this file)
    files:
      - { path: frontend/src/cache/hierarchy.test.ts, action: create }
    content: |
      import { describe, expect, it } from 'vitest'
      import { buildCacheTree } from './hierarchy'
      import type { CachedNode } from './model'

      function cached(id: number, ancestorIds: number[]): CachedNode {
        const value = `Node ${id}`
        return {
          id,
          parentId: ancestorIds.length > 0 ? ancestorIds[ancestorIds.length - 1] : null,
          value,
          originalValue: value,
          isDeleted: false,
          hasChildren: false,
          isNew: false,
          isEdited: false,
          isPendingDelete: false,
          ancestorIds,
        }
      }

      describe('buildCacheTree (smoke)', () => {
        it('nests 26 under 10 under 1 with gap markers when loaded as 26, 1, 10', () => {
          const tree = buildCacheTree([cached(26, [1, 4, 10, 18]), cached(1, []), cached(10, [1, 4])])

          expect(tree.map((n) => n.key)).toEqual(['1'])
          expect(tree[0].data.missingAncestorIds).toEqual([])

          const node10 = tree[0].children?.[0]
          expect(node10?.key).toBe('10')
