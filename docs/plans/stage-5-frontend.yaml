  - id: S16
    title: Dependency guard test (replaces the PrimeVue pin guard)
    files:
      - { path: frontend/src/dependencyPins.test.ts, action: replace }
    content: |
      // Guards the stage-5 dependency decision (docs/plans/stage-5-frontend.md DR-FE-5.1, DR-FE-5.3): PrimeVue is removed
      // completely and icons come only from lucide-vue-next, pinned exactly. Replaces the stage-4 PrimeVue pin guard (DR-FE-4.9).
      // `?raw` imports are typed by vite/client (src/vite-env.d.ts) and inlined by Vitest; no JSON-module typing needed.
      import { describe, expect, it } from 'vitest'
      import packageJsonText from '../package.json?raw'

      interface PackageJson {
        dependencies?: Record<string, string>
        devDependencies?: Record<string, string>
        overrides?: Record<string, string>
      }

      const REMOVED_PACKAGES = ['primevue', '@primeuix/themes', '@primeuix/styles', '@primeuix/styled', 'primeicons']

      const MESSAGE =
        'Stage 5 removed PrimeVue (DR-FE-5.1): the UI is plain Vue on src/styles/industry.css + src/styles/app.css and ' +
        'icons come from lucide-vue-next 0.525.0 (exact). Do not re-add PrimeVue packages or an overrides block; change ' +
        'the icon package only via a plan.'

      const pkg = JSON.parse(packageJsonText) as PackageJson

      describe('dependency pins', () => {
        it('no PrimeVue package in dependencies or devDependencies', () => {
          for (const name of REMOVED_PACKAGES) {
            expect(pkg.dependencies?.[name], `${MESSAGE} (${name})`).toBeUndefined()
            expect(pkg.devDependencies?.[name], `${MESSAGE} (${name})`).toBeUndefined()
          }
        })

        it('no overrides block', () => {
          expect(pkg.overrides, MESSAGE).toBeUndefined()
        })

        it('lucide-vue-next is pinned exactly to 0.525.0', () => {
          expect(pkg.dependencies?.['lucide-vue-next'], MESSAGE).toBe('0.525.0')
        })
      })
    done_when: File matches content.

  - id: S17
    title: Clear cache store test (roadmap DoD "covered by a store test")
    files:
      - { path: frontend/src/stores/cache.clear.test.ts, action: create }
    content: |
      // Clear cache (DR-FE-5.6) is client-only: cache.clear() must empty every piece of cache state and issue no request.
      import { createPinia, setActivePinia } from 'pinia'
      import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest'
      import { setRequestObserver } from '../api/client'
      import type { NodeDetails } from '../api/types'
      import { useCacheStore } from './cache'

      const ANC: Record<number, number[]> = {
        1: [],
        4: [1],
        10: [1, 4],
        26: [1, 4, 10, 18],
      }

      function details(id: number): NodeDetails {
        const ancestorIds = ANC[id]
        return {
          id,
          parentId: ancestorIds.length > 0 ? ancestorIds[ancestorIds.length - 1] : null,
          value: `Node ${id}`,
          isDeleted: false,
          hasChildren: true,
          ancestorIds,
        }
      }

      describe('cache clear (Clear cache button)', () => {
        const fetchMock = vi.fn()
        const start = vi.fn(() => 1)
        const finish = vi.fn()

        beforeEach(() => {
          setActivePinia(createPinia())
          fetchMock.mockReset()
          start.mockClear()
          finish.mockClear()
          vi.stubGlobal('fetch', fetchMock)
          setRequestObserver({ start, finish })
        })

        afterEach(() => {
          setRequestObserver(null)
          vi.unstubAllGlobals()
        })

        it('K1 empties nodes, pending changes, selection, expansion and temp ids without any request', () => {
          const cache = useCacheStore()
          for (const id of [1, 4, 10, 26]) {
            cache.loadNode(details(id))
          }
          expect(cache.editValue(4, 'Edited')).toBe(true)
          expect(cache.addChild(4, 'New')).toBe('tmp-1')
          expect(cache.deleteNode(10)).toBe(true)
          expect(cache.hasPendingChanges).toBe(true)
          const epochBefore = cache.epoch

          cache.clear()

          expect(cache.nodes).toEqual({})
          expect(cache.isEmpty).toBe(true)
          expect(cache.treeNodes).toEqual([])
          expect(cache.realIds).toEqual([])
          expect(cache.pendingCount).toBe(0)
          expect(cache.hasPendingChanges).toBe(false)
          expect(cache.selectedKey).toBeNull()
          expect(cache.selectedNode).toBeNull()
          expect(cache.expandedKeys).toEqual({})
          expect(cache.nextTempSeq).toBe(1)
          expect(cache.lastIdMap).toEqual({})
          expect(cache.applying).toBe(false)
          expect(cache.epoch).toBe(epochBefore + 1)
          expect(fetchMock).not.toHaveBeenCalled()
          expect(start).not.toHaveBeenCalled()
          expect(finish).not.toHaveBeenCalled()
        })

        it('K2 temp ids restart at tmp-1 after clear', () => {
          const cache = useCacheStore()
          cache.loadNode(details(1))
          expect(cache.addChild(1, 'A')).toBe('tmp-1')
          expect(cache.addChild(1, 'B')).toBe('tmp-2')
          cache.clear()
          cache.loadNode(details(1))
          expect(cache.addChild(1, 'C')).toBe('tmp-1')
          expect(fetchMock).not.toHaveBeenCalled()
        })

        it('K3 clearing an empty cache only starts a new epoch', () => {
          const cache = useCacheStore()
          const epochBefore = cache.epoch
          cache.clear()
          expect(cache.isEmpty).toBe(true)
          expect(cache.epoch).toBe(epochBefore + 1)
          expect(fetchMock).not.toHaveBeenCalled()
          expect(start).not.toHaveBeenCalled()
        })
      })
    done_when: File matches content.

