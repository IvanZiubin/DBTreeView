  - id: S6
    title: API client — request observer for the network log
    files:
      - { path: frontend/src/api/client.ts, action: replace }
    content: |
      import type {
        ApplyRequest,
        ApplyResponse,
        HealthResponse,
        Node,
        NodeDetails,
        ProblemDetails,
      } from './types'

      const BASE_PATH = '/api'

      /** Thrown for every non-2xx response (status = HTTP status) and for network failures (status = 0). */
      export class ApiError extends Error {
        readonly status: number
        readonly problem: ProblemDetails | null

        constructor(status: number, problem: ProblemDetails | null, fallbackMessage: string) {
          super(problem?.detail ?? problem?.title ?? fallbackMessage)
          this.name = 'ApiError'
          this.status = status
          this.problem = problem
        }

        /** ProblemDetails title, or a generic title when the body was not ProblemDetails. */
        get title(): string {
          return this.problem?.title ?? `Request failed (HTTP ${this.status})`
        }

        /** ProblemDetails detail plus flattened validation errors, or the error message. */
        get detail(): string {
          const parts: string[] = []
          if (this.problem?.detail) {
            parts.push(this.problem.detail)
          }
          const errors = this.problem?.errors
          if (errors) {
            for (const [field, messages] of Object.entries(errors)) {
              parts.push(`${field}: ${messages.join(', ')}`)
            }
          }
          return parts.length > 0 ? parts.join('; ') : this.message
        }
      }

      type HttpMethod = 'GET' | 'POST'

      /**
       * Receives every request made through request() (network log, DR-FE-5.5). start() runs before fetch and returns an
       * entry id; finish() runs exactly once afterwards with the HTTP status (0 = network failure) and the duration in ms
       * measured until the response body was read.
       */
      export interface RequestObserver {
        start(method: string, path: string): number
        finish(id: number, status: number, durationMs: number): void
      }

      let requestObserver: RequestObserver | null = null

      /** Registered once in main.ts (network log store); null detaches it (tests). */
      export function setRequestObserver(observer: RequestObserver | null): void {
        requestObserver = observer
      }

      async function request<T>(method: HttpMethod, path: string, body?: unknown): Promise<T> {
        const url = `${BASE_PATH}${path}`
        const observer = requestObserver
        const entryId = observer === null ? null : observer.start(method, url)
        const startedAt = performance.now()
        let status = 0
        try {
          const headers: Record<string, string> = { Accept: 'application/json' }
          if (body !== undefined) {
            headers['Content-Type'] = 'application/json'
          }

          let response: Response
          try {
            response = await fetch(url, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body),
            })
          } catch {
            throw new ApiError(
              0,
              { title: 'Network error', detail: 'The API could not be reached.' },
              'Network error',
            )
          }
          status = response.status

          if (!response.ok) {
            let problem: ProblemDetails | null = null
            const text = await response.text()
            if (text) {
              try {
                problem = JSON.parse(text) as ProblemDetails
              } catch {
                problem = null
              }
            }
            throw new ApiError(response.status, problem, `${method} ${url} failed with HTTP ${response.status}`)
          }

          return (await response.json()) as T
        } finally {
          if (observer !== null && entryId !== null) {
            observer.finish(entryId, status, Math.round(performance.now() - startedAt))
          }
        }
      }

      /** GET /api/health */
      export function getHealth(): Promise<HealthResponse> {
        return request<HealthResponse>('GET', '/health')
      }

      /** GET /api/nodes/roots */
      export function getRoots(): Promise<Node[]> {
        return request<Node[]>('GET', '/nodes/roots')
      }

      /** GET /api/nodes/{id}/children — direct children only. */
      export function getChildren(id: number): Promise<Node[]> {
        return request<Node[]>('GET', `/nodes/${id}/children`)
      }

      /** GET /api/nodes/{id} — single node with ancestorIds. Called only by useTransferStore().loadIntoCache (DR-FE-5.7). */
      export function getNode(id: number): Promise<NodeDetails> {
        return request<NodeDetails>('GET', `/nodes/${id}`)
      }

      /** POST /api/reset — returns roots after reset. */
      export function resetDatabase(): Promise<Node[]> {
        return request<Node[]>('POST', '/reset')
      }

      /** POST /api/nodes/apply — one transactional batch (contract v2). Callers send refreshIds = every real cached id (cache.realIds). */
      export function applyChanges(body: ApplyRequest): Promise<ApplyResponse> {
        return request<ApplyResponse>('POST', '/nodes/apply', body)
      }
    done_when: File matches content.

  - id: S7
    title: Pure network-log model
    files:
      - { path: frontend/src/api/networkLog.ts, action: create }
    content: |
      // Pure network-log model (no Vue/Pinia imports). Entries are newest first. See docs/plans/stage-5-frontend.md DR-FE-5.5.

      export interface NetworkLogEntry {
        id: number
        /** Start time "HH:MM:SS" (local). */
        time: string
        method: string
        /** Full path incl. /api, e.g. "/api/nodes/4". */
        path: string
        /** HTTP status; 0 = network failure; null while pending. */
        status: number | null
        /** null while pending. */
        durationMs: number | null
      }

      export const MAX_LOG_ENTRIES = 80

      function pad2(value: number): string {
        return String(value).padStart(2, '0')
      }

      export function formatClockTime(date: Date): string {
        return `${pad2(date.getHours())}:${pad2(date.getMinutes())}:${pad2(date.getSeconds())}`
      }

      /** New array with `entry` first, capped at `max` (oldest dropped). */
      export function addEntry(
        entries: readonly NetworkLogEntry[],
        entry: NetworkLogEntry,
        max: number = MAX_LOG_ENTRIES,
      ): NetworkLogEntry[] {
        return [entry, ...entries].slice(0, max)
      }

      /** New array where the entry with `id` gets status and duration; other entries unchanged. */
      export function completeEntry(
        entries: readonly NetworkLogEntry[],
        id: number,
        status: number,
        durationMs: number,
      ): NetworkLogEntry[] {
        return entries.map((entry) => (entry.id === id ? { ...entry, status, durationMs } : entry))
      }

      export function statusLabel(entry: NetworkLogEntry): string {
        if (entry.status === null) {
          return 'pending'
        }
        if (entry.status === 0) {
          return 'failed'
        }
        return String(entry.status)
      }

      /** Industry tag classes: pending neutral, 2xx accent, everything else (4xx/5xx/network) outline. */
      export function statusTagClass(entry: NetworkLogEntry): string {
        if (entry.status === null) {
          return 'tag tag-neutral'
        }
        if (entry.status >= 200 && entry.status < 300) {
          return 'tag tag-accent'
        }
        return 'tag tag-outline'
      }

      export function durationLabel(entry: NetworkLogEntry): string {
        return entry.durationMs === null ? '…' : `${entry.durationMs} ms`
      }

      /** Footer summary, e.g. "GET /api/nodes/4 → 200 · 12 ms" or "GET /api/nodes/4 → …" while pending. */
      export function entrySummary(entry: NetworkLogEntry): string {
        const status = entry.status === null ? '…' : statusLabel(entry)
        const duration = entry.durationMs === null ? '' : ` · ${entry.durationMs} ms`
        return `${entry.method} ${entry.path} → ${status}${duration}`
      }

      export function requestCountLabel(count: number): string {
        return `${count} request${count === 1 ? '' : 's'}`
      }
    done_when: File matches content.

  - id: S8
    title: Pure view models — tree rows, link lines, dialogs, transfer texts
    files:
      - { path: frontend/src/view/treeRows.ts, action: create }
      - { path: frontend/src/view/linkLines.ts, action: create }
      - { path: frontend/src/view/dialogs.ts, action: create }
      - { path: frontend/src/view/transfer.ts, action: create }
    content_for_new_files:
      frontend/src/view/treeRows.ts: |
        // Pure row models for the two tree views (no Vue/Pinia imports). See docs/plans/stage-5-frontend.md DR-FE-5.4.
        import { compareCacheIds } from '../cache/hierarchy'
        import type { CacheId, CachedNode, CacheTreeNode } from '../cache/model'
        import { nodeStatus, type NodeStatus } from '../cache/pending'
        import type { DbTreeNode } from './types'

        /** Indent per depth level in px (hairline rows); equals --row-indent in src/styles/app.css. */
        export const ROW_INDENT_PX = 18

        export interface DbRow {
          key: string
          depth: number
          node: DbTreeNode
          /** Not a leaf: shows the chevron (or the spinner while loading). */
          hasToggle: boolean
          /** Expanded AND children loaded; only then are children listed. */
          expanded: boolean
          loading: boolean
        }

        /** Depth-first visible DB rows; children are listed only for expanded nodes whose children are loaded. */
        export function flattenDbTree(
          roots: readonly DbTreeNode[],
          expandedKeys: Readonly<Record<string, boolean>>,
        ): DbRow[] {
          const rows: DbRow[] = []
          function walk(nodes: readonly DbTreeNode[], depth: number): void {
            for (const node of nodes) {
              const expanded = !node.leaf && expandedKeys[node.key] === true && node.children !== undefined
              rows.push({ key: node.key, depth, node, hasToggle: !node.leaf, expanded, loading: node.loading })
              if (expanded && node.children !== undefined) {
                walk(node.children, depth + 1)
              }
            }
          }
          walk(roots, 0)
          return rows
        }

        export interface CacheRow {
          key: string
          depth: number
          node: CachedNode
          missingAncestorIds: CacheId[]
          hasToggle: boolean
          expanded: boolean
          status: NodeStatus
        }

        /** Depth-first visible cache rows from buildCacheTree output; children listed only for expanded rows. */
        export function flattenCacheTree(
          tree: readonly CacheTreeNode[],
          expandedKeys: Readonly<Record<string, boolean>>,
        ): CacheRow[] {
          const rows: CacheRow[] = []
          function walk(nodes: readonly CacheTreeNode[], depth: number): void {
            for (const treeNode of nodes) {
              const hasToggle = treeNode.children.length > 0
              const expanded = hasToggle && expandedKeys[treeNode.key] === true
              rows.push({
                key: treeNode.key,
                depth,
                node: treeNode.data.node,
                missingAncestorIds: treeNode.data.missingAncestorIds,
                hasToggle,
                expanded,
                status: nodeStatus(treeNode.data.node),
              })
              if (expanded) {
                walk(treeNode.children, depth + 1)
              }
            }
          }
          walk(tree, 0)
          return rows
        }

        export interface TagSpec {
          label: string
          /** Industry tag classes. */
          className: string
        }

        const STATUS_TAGS: Record<NodeStatus, TagSpec | null> = {
          clean: null,
          new: { label: 'new', className: 'tag tag-accent' },
          edited: { label: 'edited', className: 'tag tag-outline' },
          'pending-delete': { label: 'to delete', className: 'tag tag-neutral' },
          deleted: { label: 'deleted', className: 'tag tag-neutral' },
        }

        export function statusTag(status: NodeStatus): TagSpec | null {
          return STATUS_TAGS[status]
        }

        /** Value shown struck through (deleted in the DB or marked for deletion). */
        export function isStruck(status: NodeStatus): boolean {
          return status === 'deleted' || status === 'pending-delete'
        }

        /** Right-hand id label: "tmp" for new nodes, "#<id>" otherwise. */
        export function idLabel(node: CachedNode): string {
          return node.isNew ? 'tmp' : `#${node.id}`
        }

        /** "parent #<parentId>" when the direct parent is not cached (gap), '' otherwise. */
        export function gapHint(row: CacheRow): string {
          return row.missingAncestorIds.length > 0 && row.node.parentId !== null ? `parent #${row.node.parentId}` : ''
        }

        export function guideWidth(depth: number): string {
          return `${depth * ROW_INDENT_PX}px`
        }

        /** Keys of all nodes with isPendingDelete, ordered by compareCacheIds (used for the "cascade" flash). */
        export function pendingDeleteKeys(nodes: Readonly<Record<string, CachedNode>>): string[] {
          return Object.keys(nodes)
            .filter((key) => nodes[key].isPendingDelete)
            .sort((a, b) => compareCacheIds(nodes[a].id, nodes[b].id))
        }
      frontend/src/view/linkLines.ts: |
        // Pure geometry for the SVG link lines between a DB row and its cached copy (no Vue/Pinia imports). DR-FE-5.10.

        export interface Box {
          left: number
          top: number
          right: number
          bottom: number
        }

        export interface RowBox {
          key: string
          top: number
          bottom: number
        }

        export interface LinkLineInput {
          /** Workspace rect; every output coordinate is relative to its top-left corner. */
          origin: Box
          /** DB tree scroll body rect. */
          dbPanel: Box
          /** Cache tree scroll body rect. */
          cachePanel: Box
          dbRows: readonly RowBox[]
          cacheRows: readonly RowBox[]
          /** Hovered / selected keys (either side). */
          activeKeys: ReadonlySet<string>
        }

        export interface LinkLine {
          key: string
          x1: number
          y1: number
          x2: number
          y2: number
          active: boolean
        }

        export const VISIBILITY_MARGIN_PX = 2

        export function isRowVisible(row: RowBox, panel: Box): boolean {
          return row.bottom > panel.top + VISIBILITY_MARGIN_PX && row.top < panel.bottom - VISIBILITY_MARGIN_PX
        }

        /**
         * One line per key that is visible in both scroll bodies: from the DB body's right edge at the DB row centre to the
         * cache body's left edge at the cache row centre (y rounded). Inactive lines first, active lines last (drawn on top),
         * each group in cache-row order.
         */
        export function computeLinkLines(input: LinkLineInput): LinkLine[] {
          const { origin, dbPanel, cachePanel } = input
          const dbCentres = new Map<string, number>()
          for (const row of input.dbRows) {
            if (isRowVisible(row, dbPanel)) {
              dbCentres.set(row.key, (row.top + row.bottom) / 2 - origin.top)
            }
          }
          const x1 = dbPanel.right - origin.left
          const x2 = cachePanel.left - origin.left
          const inactive: LinkLine[] = []
          const active: LinkLine[] = []
          for (const row of input.cacheRows) {
            const dbCentre = dbCentres.get(row.key)
            if (dbCentre === undefined || !isRowVisible(row, cachePanel)) {
              continue
            }
            const line: LinkLine = {
              key: row.key,
              x1,
              y1: Math.round(dbCentre),
              x2,
              y2: Math.round((row.top + row.bottom) / 2 - origin.top),
              active: input.activeKeys.has(row.key),
            }
            if (line.active) {
              active.push(line)
            } else {
              inactive.push(line)
            }
          }
          return inactive.concat(active)
        }

        /** Cubic bezier from the mock: control points at half the horizontal distance. */
        export function linkPath(line: LinkLine): string {
          const half = (line.x2 - line.x1) * 0.5
          return `M${line.x1} ${line.y1} C${line.x1 + half} ${line.y1}, ${line.x2 - half} ${line.y2}, ${line.x2} ${line.y2}`
        }

        export function sameLines(a: readonly LinkLine[], b: readonly LinkLine[]): boolean {
          if (a.length !== b.length) {
            return false
          }
          return a.every((line, index) => {
            const other = b[index]
            return (
              line.key === other.key &&
              line.x1 === other.x1 &&
              line.y1 === other.y1 &&
              line.x2 === other.x2 &&
              line.y2 === other.y2 &&
              line.active === other.active
            )
          })
        }
      frontend/src/view/dialogs.ts: |
        // Pure texts and itemisation for the Apply and Clear-cache dialogs (no Vue/Pinia imports). DR-FE-5.6, DR-FE-5.9.
        import { cacheKey, type CachedNode } from '../cache/model'
        import type { ApplyPlan } from '../cache/pending'

        export type ApplyItemKind = 'add' | 'edit' | 'delete' | 'discard'

        export interface ApplyItem {
          kind: ApplyItemKind
          /** Tag text (the kind). */
          tag: string
          /** Industry tag classes. */
          tagClass: string
          text: string
        }

        const TAG_CLASS: Record<ApplyItemKind, string> = {
          add: 'tag tag-accent',
          edit: 'tag tag-outline',
          delete: 'tag tag-neutral',
          discard: 'tag tag-neutral',
        }

        function item(kind: ApplyItemKind, text: string): ApplyItem {
          return { kind, tag: kind, tagClass: TAG_CLASS[kind], text }
        }

        /** "#id value" for a real node, "value" for a temp node, "#key" when the key is not cached. */
        export function nodeLabel(key: string, nodes: Readonly<Record<string, CachedNode>>): string {
          const node = nodes[key]
          if (!node) {
            return `#${key}`
          }
          return node.isNew ? node.value : `#${node.id} ${node.value}`
        }

        /**
         * Dialog rows in order: adds, edits, top-most deletes (exactly what is sent), then discards (dropped temp nodes and
         * edits of effectively deleted nodes, which the apply settles without sending).
         */
        export function buildApplyItems(plan: ApplyPlan, nodes: Readonly<Record<string, CachedNode>>): ApplyItem[] {
          const items: ApplyItem[] = []
          for (const add of plan.request.adds) {
            const parentKey = typeof add.parentTempId === 'string' ? add.parentTempId : String(add.parentId)
            items.push(item('add', `${add.value} under ${nodeLabel(parentKey, nodes)}`))
          }
          for (const edit of plan.request.edits) {
            const node = nodes[cacheKey(edit.id)]
            items.push(
              item('edit', node ? `#${edit.id} ${node.originalValue} → ${edit.value}` : `#${edit.id} → ${edit.value}`),
            )
          }
          for (const id of plan.request.deletes) {
            items.push(item('delete', `${nodeLabel(cacheKey(id), nodes)} and all descendants`))
          }
          for (const key of plan.droppedTempKeys) {
            const node = nodes[key]
            items.push(item('discard', `${node ? node.value : key} (new) is discarded`))
          }
          for (const key of plan.discardedEditKeys) {
            items.push(item('discard', `#${key} edit is discarded (node is deleted)`))
          }
          return items
        }

        /** Number of changes actually sent (edits + adds + deletes). */
        export function sentChangeCount(plan: ApplyPlan): number {
          const { edits, adds, deletes } = plan.request
          return edits.length + adds.length + deletes.length
        }

        export function applySummary(plan: ApplyPlan): string {
          const count = sentChangeCount(plan)
          if (count === 0) {
            return 'Nothing will be written to the database; discarded local changes are removed from the cache.'
          }
          return `${count} pending change${count === 1 ? '' : 's'} will be written to the database in one transaction.`
        }

        export type ClearCacheDecision = 'disabled' | 'confirm' | 'clear'

        export interface ClearCacheState {
          isEmpty: boolean
          applying: boolean
          pendingCount: number
        }

        /** Clear cache button: disabled when empty or applying; confirm only when pending changes would be lost. */
        export function decideClearCache(state: ClearCacheState): ClearCacheDecision {
          if (state.isEmpty || state.applying) {
            return 'disabled'
          }
          return state.pendingCount > 0 ? 'confirm' : 'clear'
        }

        export function clearCacheMessage(pendingCount: number): string {
          return `${pendingCount} unapplied change${pendingCount === 1 ? '' : 's'} will be lost.`
        }
      frontend/src/view/transfer.ts: |
        // Pure texts for the transfer gutter (no Vue/Pinia imports). DR-FE-5.7.

        /** Outcome of the last GET /api/nodes/{id} issued by useTransferStore().loadIntoCache. */
        export interface LastLoad {
          id: number
          label: string
          /** HTTP status; 0 = network failure. */
          status: number
          durationMs: number
          /** Cached rows that moved under the loaded node (0 for reloads and failures). */
          reparented: number
        }

        /** "#4 Computers" */
        export function nodeRef(id: number, label: string): string {
          return `#${id} ${label}`
        }

        export function loadPath(id: number): string {
          return `GET /api/nodes/${id}`
        }

        /** "200 · 14 ms", "200 · 14 ms · 2 re-parented", "404 · 9 ms", "network error · 3 ms". */
        export function lastLoadStatusText(last: LastLoad): string {
          const status = last.status === 0 ? 'network error' : String(last.status)
          const reparented = last.reparented > 0 ? ` · ${last.reparented} re-parented` : ''
          return `${status} · ${last.durationMs} ms${reparented}`
        }
    done_when: All four files match content.

  - id: S9
    title: New Pinia stores — network log, toasts, highlight, transfer
    files:
      - { path: frontend/src/stores/networkLog.ts, action: create }
      - { path: frontend/src/stores/toasts.ts, action: create }
      - { path: frontend/src/stores/highlight.ts, action: create }
      - { path: frontend/src/stores/transfer.ts, action: create }
    content_for_new_files:
      frontend/src/stores/networkLog.ts: |
        import { defineStore } from 'pinia'
        import { computed, ref } from 'vue'
        import { addEntry, completeEntry, formatClockTime, type NetworkLogEntry } from '../api/networkLog'

        /** Every API request issued by the UI (fed by the RequestObserver registered in main.ts, DR-FE-5.5). */
        export const useNetworkLogStore = defineStore('networkLog', () => {
          /** Newest first, at most MAX_LOG_ENTRIES. Never cleared (Reset / Clear cache keep the history). */
          const entries = ref<NetworkLogEntry[]>([])
          /** Footer table expanded. */
          const open = ref(false)
          let nextId = 1

          const hasPending = computed<boolean>(() => entries.value.some((entry) => entry.status === null))
          const last = computed<NetworkLogEntry | null>(() => (entries.value.length > 0 ? entries.value[0] : null))

          function start(method: string, path: string, now: Date = new Date()): number {
            const id = nextId
            nextId += 1
            entries.value = addEntry(entries.value, {
              id,
              time: formatClockTime(now),
              method,
              path,
              status: null,
              durationMs: null,
            })
            return id
          }

          function finish(id: number, status: number, durationMs: number): void {
            entries.value = completeEntry(entries.value, id, status, durationMs)
          }

          function toggle(): void {
            open.value = !open.value
          }

          return { entries, open, hasPending, last, start, finish, toggle }
        })
      frontend/src/stores/toasts.ts: |
        import { defineStore } from 'pinia'
        import { ref } from 'vue'

        export type ToastSeverity = 'success' | 'info' | 'warn' | 'error'

        export interface ToastInput {
          severity: ToastSeverity
          summary: string
          detail: string
          /** Auto-dismiss delay; default DEFAULT_TOAST_LIFE_MS. */
          lifeMs?: number
        }

        export interface Toast {
          id: number
          severity: ToastSeverity
          summary: string
          detail: string
        }

        export const DEFAULT_TOAST_LIFE_MS = 3200
        export const MAX_TOASTS = 4

        /** Blueprint toasts (DR-FE-5.12). */
        export const useToastStore = defineStore('toasts', () => {
          /** Oldest first, at most MAX_TOASTS. */
          const toasts = ref<Toast[]>([])
          let nextId = 1

          function dismiss(id: number): void {
            toasts.value = toasts.value.filter((toast) => toast.id !== id)
          }

          function show(input: ToastInput): number {
            const id = nextId
            nextId += 1
            const toast: Toast = { id, severity: input.severity, summary: input.summary, detail: input.detail }
            toasts.value = [...toasts.value, toast].slice(-MAX_TOASTS)
            setTimeout(() => {
              dismiss(id)
            }, input.lifeMs ?? DEFAULT_TOAST_LIFE_MS)
            return id
          }

          return { toasts, show, dismiss }
        })
      frontend/src/stores/highlight.ts: |
        import { defineStore } from 'pinia'
        import { ref } from 'vue'

        export type HoverSide = 'db' | 'cache'

        export interface Hover {
          side: HoverSide
          key: string
        }

        /** Flash map prefixes: 'c' = cache row, 'db' = DB row. */
        export type FlashScope = 'c' | 'db'

        export const FLASH_MS = 1800

        /** Cross-panel hover link and transient flash tags (DR-FE-5.10, DR-FE-5.11). */
        export const useHighlightStore = defineStore('highlight', () => {
          const hover = ref<Hover | null>(null)
          /** '<scope>:<key>' -> transient tag label ('' = highlight only). */
          const flash = ref<Record<string, string>>({})
          let flashGeneration = 0

          function setHover(side: HoverSide, key: string): void {
            const current = hover.value
            if (current !== null && current.side === side && current.key === key) {
              return
            }
            hover.value = { side, key }
          }

          function clearHover(): void {
            if (hover.value !== null) {
              hover.value = null
            }
          }

          /** A row on `side` is linked when the same key is hovered in the other panel. */
          function isLinked(side: HoverSide, key: string): boolean {
            const current = hover.value
            return current !== null && current.side !== side && current.key === key
          }

          /** Adds entries for FLASH_MS; an entry is removed only if it still has the same value (newer flashes survive). */
          function flashKeys(entries: Readonly<Record<string, string>>): void {
            const keys = Object.keys(entries)
            if (keys.length === 0) {
              return
            }
            flash.value = { ...flash.value, ...entries }
            const generation = flashGeneration
            setTimeout(() => {
              if (generation !== flashGeneration) {
                return
              }
              const next: Record<string, string> = { ...flash.value }
              for (const key of keys) {
                if (next[key] === entries[key]) {
                  delete next[key]
                }
              }
              flash.value = next
            }, FLASH_MS)
          }

          function isFlashing(scope: FlashScope, key: string): boolean {
            return Object.prototype.hasOwnProperty.call(flash.value, `${scope}:${key}`)
          }

          /** Transient tag label, or null when none / highlight only. */
          function flashTag(scope: FlashScope, key: string): string | null {
            const value = flash.value[`${scope}:${key}`]
            return value ? value : null
          }

          /** Drops hover and every flash; pending timers become no-ops (Reset / Clear cache). */
          function clear(): void {
            hover.value = null
            flash.value = {}
            flashGeneration += 1
          }

          return { hover, flash, setHover, clearHover, isLinked, flashKeys, isFlashing, flashTag, clear }
        })
      frontend/src/stores/transfer.ts: |
        import { defineStore } from 'pinia'
        import { computed, ref } from 'vue'
        import { ApiError, getNode } from '../api/client'
        import { reparentedKeys } from '../cache/hierarchy'
        import { cacheKey } from '../cache/model'
        import { reportError } from '../errors'
        import type { LastLoad } from '../view/transfer'
        import { useCacheStore } from './cache'
        import { useHighlightStore } from './highlight'

        export interface PendingLoad {
          id: number
          label: string
          seq: number
        }

        export interface DragState {
          id: number
          label: string
        }

        /** A node that was new to the cache on its last load; CachedTreeView plays the fly-in once per seq. */
        export interface Flight {
          key: string
          label: string
          seq: number
        }

        /** DB -> cache transfer: the single load path, drag state and gutter stats (DR-FE-5.7). */
        export const useTransferStore = defineStore('transfer', () => {
          const pendingLoad = ref<PendingLoad | null>(null)
          const lastLoad = ref<LastLoad | null>(null)
          const drag = ref<DragState | null>(null)
          const flight = ref<Flight | null>(null)
          let loadSeq = 0

          const isLoading = computed<boolean>(() => pendingLoad.value !== null)

          /**
           * The only GET /api/nodes/{id} call (button, double-click and drop all use it). Ignored (false) while another load
           * is in flight. The response is discarded when the cache epoch changed or reset() ran meanwhile (Reset / Clear
           * cache). On success: re-parent count, fly-in flight for new nodes, cache.loadNode, lastLoad, re-parented flash.
           * On failure: lastLoad with the error status, reportError. Returns true when the node was merged into the cache.
           */
          async function loadIntoCache(id: number, label: string): Promise<boolean> {
            if (pendingLoad.value !== null) {
              return false
            }
            const cache = useCacheStore()
            const highlight = useHighlightStore()
            loadSeq += 1
            const seq = loadSeq
            const startedEpoch = cache.epoch
            pendingLoad.value = { id, label, seq }
            const startedAt = performance.now()
            const isCurrent = (): boolean =>
              startedEpoch === cache.epoch && pendingLoad.value !== null && pendingLoad.value.seq === seq
            try {
              const details = await getNode(id)
              const durationMs = Math.round(performance.now() - startedAt)
              if (!isCurrent()) {
                return false
              }
              const key = cacheKey(details.id)
              const isNewToCache = !(key in cache.nodes)
              const moved = isNewToCache ? reparentedKeys(cache.nodeList, details.id) : []
              if (isNewToCache) {
                flight.value = { key, label: details.value, seq }
              }
              cache.loadNode(details)
              lastLoad.value = {
                id: details.id,
                label: details.value,
                status: 200,
                durationMs,
                reparented: moved.length,
              }
              const flashes: Record<string, string> = {}
              for (const movedKey of moved) {
                flashes[`c:${movedKey}`] = 're-parented'
              }
              highlight.flashKeys(flashes)
              return true
            } catch (err) {
              const durationMs = Math.round(performance.now() - startedAt)
              if (isCurrent()) {
                lastLoad.value = {
                  id,
                  label,
                  status: err instanceof ApiError ? err.status : 0,
                  durationMs,
                  reparented: 0,
                }
              }
              reportError(err)
              return false
            } finally {
              if (pendingLoad.value !== null && pendingLoad.value.seq === seq) {
                pendingLoad.value = null
              }
            }
          }

          function startDrag(id: number, label: string): void {
            drag.value = { id, label }
          }

          function endDrag(): void {
            drag.value = null
          }

          /** Forgets every transfer state; an in-flight load is then discarded (Reset / Clear cache). */
          function reset(): void {
            pendingLoad.value = null
            lastLoad.value = null
            drag.value = null
            flight.value = null
          }

          return { pendingLoad, lastLoad, drag, flight, isLoading, loadIntoCache, startDrag, endDrag, reset }
        })
    done_when: All four files match content.

  - id: S10
    title: errors.ts on the toast store; DOM motion helpers
    files:
      - { path: frontend/src/errors.ts, action: replace }
      - { path: frontend/src/motion/motion.ts, action: create }
    content_for_new_files:
      frontend/src/errors.ts: |
        import { ApiError } from './api/client'
        import type { ToastInput } from './stores/toasts'

        /** Error toasts stay longer than the 3.2 s default. */
        export const ERROR_TOAST_LIFE_MS = 6000

        type ShowToast = (toast: ToastInput) => void

        let showToast: ShowToast | null = null

        /** Called once from App.vue setup with the toast store's show(). */
        export function installErrorToast(show: ShowToast): void {
          showToast = show
        }

        export function describeError(err: unknown): { summary: string; detail: string } {
          if (err instanceof ApiError) {
            return { summary: err.title, detail: err.detail }
          }
          if (err instanceof Error) {
            return { summary: 'Unexpected error', detail: err.message }
          }
          return { summary: 'Unexpected error', detail: String(err) }
        }

        /** Logs the error and shows an error toast with ProblemDetails title/detail. */
        export function reportError(err: unknown): void {
          console.error(err)
          const { summary, detail } = describeError(err)
          showToast?.({ severity: 'error', summary, detail, lifeMs: ERROR_TOAST_LIFE_MS })
        }
      frontend/src/motion/motion.ts: |
        // DOM-only motion helpers (Web Animations API), no Vue imports. Not unit-tested (Vitest runs in Node); every helper
        // is a no-op when the user prefers reduced motion. See docs/plans/stage-5-frontend.md DR-FE-5.11.

        export const FLIP_MS = 460
        export const FADE_IN_MS = 320
        export const FLY_MS = 720

        export function prefersReducedMotion(): boolean {
          return (
            typeof window !== 'undefined' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches
          )
        }

        /** Rects of every element carrying `attr`, keyed by the attribute value. */
        export function captureRowRects(container: HTMLElement | null, attr: string): Map<string, DOMRect> {
          const rects = new Map<string, DOMRect>()
          if (container === null) {
            return rects
          }
          for (const element of Array.from(container.querySelectorAll<HTMLElement>(`[${attr}]`))) {
            const key = element.getAttribute(attr)
            if (key !== null) {
              rects.set(key, element.getBoundingClientRect())
            }
          }
          return rects
        }

        /** FLIP: rows that moved slide from their old position; rows that are new fade in (except skipKey, the fly target). */
        export function playFlip(
          container: HTMLElement | null,
          attr: string,
          before: ReadonlyMap<string, DOMRect>,
          skipKey: string | null,
        ): void {
          if (container === null || prefersReducedMotion()) {
            return
          }
          for (const element of Array.from(container.querySelectorAll<HTMLElement>(`[${attr}]`))) {
            const key = element.getAttribute(attr)
            if (key === null || key === skipKey) {
              continue
            }
            const now = element.getBoundingClientRect()
            const previous = before.get(key)
            if (previous) {
              const dx = previous.left - now.left
              const dy = previous.top - now.top
              if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                element.animate(
                  [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }],
                  { duration: FLIP_MS, easing: 'cubic-bezier(.2,.7,.2,1)' },
                )
              }
            } else {
              element.animate(
                [
                  { opacity: 0, transform: 'translateX(-10px)' },
                  { opacity: 1, transform: 'none' },
                ],
                { duration: FADE_IN_MS, easing: 'ease-out' },
              )
            }
          }
        }

        /** Accent chip with `label` flies from the DB row value (source) to the cache row (target), which appears on arrival. */
        export function flyChip(source: Element, target: Element, label: string): void {
          if (prefersReducedMotion()) {
            return
          }
          const from = source.getBoundingClientRect()
          const targetValue = target.querySelector('[data-val]') ?? target
          const to = targetValue.getBoundingClientRect()
          target.animate([{ opacity: 0 }, { opacity: 0, offset: 0.82 }, { opacity: 1 }], { duration: FLY_MS })
          const chip = document.createElement('div')
          chip.className = 'fly-chip'
          chip.textContent = label
          chip.style.left = `${from.left - 8}px`
          chip.style.top = `${from.top + from.height / 2 - 13}px`
          document.body.appendChild(chip)
          const dx = to.left - from.left
          const dy = to.top + to.height / 2 - (from.top + from.height / 2)
          const animation = chip.animate(
            [
              { transform: 'translate(0, 0) scale(.96)', opacity: 0 },
              { transform: 'translate(0, -3px) scale(1.04)', opacity: 1, offset: 0.12 },
              { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 40}px) scale(1.06)`, offset: 0.5 },
              { transform: `translate(${dx}px, ${dy}px) scale(1)`, opacity: 1, offset: 0.86 },
              { transform: `translate(${dx}px, ${dy}px) scale(1)`, opacity: 0 },
            ],
            { duration: FLY_MS, easing: 'cubic-bezier(.35,.55,.2,1)' },
          )
          animation.onfinish = () => {
            chip.remove()
          }
          animation.oncancel = () => {
            chip.remove()
          }
        }
    done_when: Both files match content.

  - id: S11
    title: Small shared components — BlueprintCorners, StatusTags, ConfirmDialog, ToastStack
