docs_and_tests_updates:
  frontend_claude_md: Written by the implementer in S22 (layout, styling approach, design source); docs-and-tests only adds the stage-5 test_matrix file names to the Tests line.
  readme_frontend_outline:   # sentences docs-and-tests puts into README.md (frontend part)
    - "UI: the 'Industry' design (source docs/design/stage-5/): DB and Cache blueprint panels joined by link lines; load a node into the cache with the button, a double-click or drag-and-drop onto the cache panel - all three use one GET /api/nodes/{id}."
    - "Cache editing is inline (double-click / F2 / Edit; Enter commits, Escape cancels, blur commits); tags new / edited / to delete / deleted; Apply opens a dialog listing every change before one transactional POST /api/nodes/apply."
    - "Clear cache empties the local cache (incl. unapplied changes and temp ids) without any API call and without touching the database; it asks for confirmation only when changes would be lost."
    - "Network log: collapsible footer listing every API request the UI makes (time, method, path, status, duration)."
    - "Styling: no UI component library - Industry tokens and component classes ported to frontend/src/styles/industry.css, app classes in frontend/src/styles/app.css; Barlow / Barlow Condensed from Google Fonts; Lucide icons (lucide-vue-next). Motion honours prefers-reduced-motion; minimum width 1024px."
    - "Frontend tests: `cd frontend && npm test` (Vitest, Node env: hierarchy, pending-change logic, stores incl. Clear cache and the single load path, network log, view models, dependency guard)."
  root_claude_md_decisions:   # for the organizer
    - "Replace the PrimeVue styling-pin line with: UI library / styling - PrimeVue removed in stage 5; plain Vue on src/styles/industry.css (verbatim Industry port) + src/styles/app.css (tokens only, no component <style>); icons lucide-vue-next 0.525.0 exact (stroke 1.5); fonts via Google Fonts link; src/dependencyPins.test.ts guards 'no PrimeVue, lucide pinned' - [decision records](docs/plans/stage-5-frontend.md#decision-records)"
    - "Add: Network log / load path / Clear cache - client.ts reports every request to a RequestObserver (Pinia networkLog store, registered in main.ts); button, double-click and drop load through useTransferStore().loadIntoCache (sole getNode caller); Clear cache is client-only (cache.clear() + transfer.reset() + highlight.clear()), confirm only with pending changes - [decision records](docs/plans/stage-5-frontend.md#decision-records)"

