test_matrix:
  owner: docs-and-tests (workflow test phase); the implementer writes only S16 (pin guard) and S17 (Clear-cache store test)
  conventions:
    - Explicit imports from 'vitest' (describe, it, expect, beforeEach, afterEach, vi); no globals; Node environment; no jsdom, no component mounting. Do not edit existing test files.
    - Store tests call setActivePinia(createPinia()) in beforeEach.
    - "Tests that stub fetch use vi.stubGlobal('fetch', vi.fn()) and afterEach(() => { vi.unstubAllGlobals(); setRequestObserver(null) }). Responses: new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } })."
    - "transfer.test.ts mocks the client but keeps ApiError: vi.mock('../api/client', async (importOriginal) => ({ ...(await importOriginal<typeof import('../api/client')>()), getNode: vi.fn() })); silence reportError with vi.spyOn(console, 'error').mockImplementation(() => {})."
    - Timer-based stores (highlight, toasts) use vi.useFakeTimers() / vi.advanceTimersByTime and vi.useRealTimers() in afterEach.
    - Seed-shaped fixtures - 1 [], 2 [], 3 [], 4 [1], 5 [1], 10 [1,4], 18 [1,4,10], 26 [1,4,10,18], 27 [1,4,10,18]; value `Node <id>` unless stated.
    - Test files must type-check under tsconfig.app.json strict rules (npm run build).
  client_cases:   # src/api/client.test.ts (real client, fetch stubbed, observer = { start: vi.fn(() => 7), finish: vi.fn() })
    - { id: N1, case: "GET success is reported", given: "fetch resolves 200 []; getRoots()", expect: "resolves []; fetch called once with '/api/nodes/roots' and init.method 'GET'; start called once with ('GET', '/api/nodes/roots'); finish called once with (7, 200, a number >= 0)" }
    - { id: N2, case: "POST body and path", given: "fetch resolves 200 {idMap:{}, nodes:[]}; applyChanges({edits:[],adds:[],deletes:[1],refreshIds:[1]})", expect: "start ('POST', '/api/nodes/apply'); JSON.parse(init.body) equals the request; finish status 200" }
    - { id: N3, case: "404 ProblemDetails", given: "fetch resolves 404 {title:'Not Found', detail:'Node 999 not found'}; getNode(999)", expect: "rejects ApiError status 404, title 'Not Found', detail 'Node 999 not found'; finish called once with status 404" }
    - { id: N4, case: "network failure", given: "fetch rejects new TypeError('failed'); getChildren(1)", expect: "rejects ApiError status 0 title 'Network error'; finish called once with status 0" }
    - { id: N5, case: "invalid JSON on 200", given: "fetch resolves new Response('not json', {status:200}); getRoots()", expect: "rejects; finish called once with status 200" }
    - { id: N6, case: "no observer", given: "setRequestObserver(null); fetch 200 []", expect: "getRoots resolves []; no throw" }
    - { id: N7, case: "observer captured at start", given: "observer A set; fetch returns a deferred; start getRoots(); setRequestObserver(B); resolve 200 []", expect: "A.finish called once; B.start and B.finish not called" }
  network_log_cases:   # src/api/networkLog.test.ts (pure)
    - { id: L1, case: "formatClockTime", given: "new Date(2026, 0, 2, 3, 4, 5)", expect: "'03:04:05'" }
    - { id: L2, case: "addEntry newest first + cap", given: "81 successive addEntry calls with ids 1..81 and default max", expect: "length 80; [0].id 81; last id 2" }
    - { id: L3, case: "completeEntry", given: "entries ids [2,1]; completeEntry(entries, 1, 404, 9)", expect: "new array; id 1 has status 404, durationMs 9; id 2 unchanged (same object); unknown id 99 -> contents equal input" }
    - { id: L4, case: "statusLabel", given: "status null / 0 / 404", expect: "'pending' / 'failed' / '404'" }
    - { id: L5, case: "statusTagClass", given: "null / 200 / 204 / 404 / 500 / 0", expect: "'tag tag-neutral' / 'tag tag-accent' x2 / 'tag tag-outline' x3" }
    - { id: L6, case: "durationLabel", given: "null / 12", expect: "'…' / '12 ms'" }
    - { id: L7, case: "entrySummary", given: "GET /api/nodes/4 pending; same with 200, 12 ms; POST /api/reset status 0, 3 ms", expect: "'GET /api/nodes/4 → …' / 'GET /api/nodes/4 → 200 · 12 ms' / 'POST /api/reset → failed · 3 ms'" }
    - { id: L8, case: "requestCountLabel", given: "0 / 1 / 2", expect: "'0 requests' / '1 request' / '2 requests'" }
  network_log_store_cases:   # src/stores/networkLog.test.ts
    - { id: NL1, case: "start", given: "start('GET','/api/nodes/roots'); start('GET','/api/nodes/1')", expect: "returns 1 then 2; entries ids [2,1]; both status null; hasPending true; last.id 2" }
    - { id: NL2, case: "finish", given: "after NL1: finish(1, 200, 5); finish(2, 404, 7)", expect: "entry 1 {status 200, durationMs 5}; entry 2 {status 404, durationMs 7}; hasPending false" }
    - { id: NL3, case: "toggle", given: "fresh store; toggle(); toggle()", expect: "open false -> true -> false" }
    - { id: NL4, case: "time from now param", given: "start('POST','/api/reset', new Date(2026,0,1,9,8,7))", expect: "entries[0].time '09:08:07'" }
    - { id: NL5, case: "wired to the real client", given: "setRequestObserver({ start: (m,p) => store.start(m,p), finish: (i,s,d) => store.finish(i,s,d) }); fetch stub 200 []; await getRoots()", expect: "entries length 1; {method 'GET', path '/api/nodes/roots', status 200}; durationMs is a number >= 0" }
  reparent_cases:   # src/cache/reparent.test.ts (reparentedKeys from src/cache/hierarchy.ts)
    - { id: RP1, case: "load root above gap", given: "cached 10, 26; loadedId 1", expect: "['10'] (26 has cached 10 between)" }
    - { id: RP2, case: "siblings move together", given: "cached 10, 26, 27; loadedId 18", expect: "['26','27']" }
    - { id: RP3, case: "already cached", given: "cached 1, 10; loadedId 1", expect: "[]" }
    - { id: RP4, case: "unrelated", given: "cached 5, 2; loadedId 10", expect: "[]" }
    - { id: RP5, case: "temp nodes", given: "cached 1, 10, tmp-1 (ancestorIds [1,4,10]); loadedId 4", expect: "['10']" }
    - { id: RP6, case: "order", given: "cached 27, 26 inserted in that order; loadedId 18", expect: "['26','27']" }
  tree_rows_cases:   # src/view/treeRows.test.ts (DbTreeNode via toTreeNode from src/stores/dbTree.ts or literal objects)
    - { id: TR1, case: "flattenDbTree collapsed", given: "roots 1 (hasChildren) and 2 (leaf), expandedKeys {}", expect: "keys ['1','2']; depths [0,0]; hasToggle [true,false]; expanded [false,false]" }
    - { id: TR2, case: "flattenDbTree expanded", given: "roots 1 and 2; 1 with children [4 (hasChildren), 5 (leaf)], 4 with children [10]; expandedKeys {'1':true,'4':true}", expect: "keys ['1','4','10','5','2']; depths [0,1,2,1,0]" }
