      frontend/src/components/BlueprintCorners.vue: |
        <!-- The four "+" registration marks of an Industry .blueprint object; must be a direct child of the .blueprint element. -->
        <template>
          <i class="corner tl" aria-hidden="true"></i>
          <i class="corner tr" aria-hidden="true"></i>
          <i class="corner bl" aria-hidden="true"></i>
          <i class="corner br" aria-hidden="true"></i>
        </template>
      frontend/src/components/StatusTags.vue: |
        <script setup lang="ts">
        import { computed } from 'vue'
        import type { NodeStatus } from '../cache/pending'
        import { statusTag } from '../view/treeRows'

        const props = defineProps<{
          status: NodeStatus
          /** Transient flash tag (re-parented / cascade / saved #id), null for none. */
          flash: string | null
        }>()

        const tag = computed(() => statusTag(props.status))
        </script>

        <template>
          <span v-if="tag" class="tree-tag" :class="tag.className" data-testid="status-tag">{{ tag.label }}</span>
          <span v-if="flash" class="tree-tag tree-tag--flash tag tag-accent" data-testid="flash-tag">{{ flash }}</span>
        </template>
      frontend/src/components/ConfirmDialog.vue: |
        <script setup lang="ts">
        import { nextTick, ref, watch } from 'vue'
        import BlueprintCorners from './BlueprintCorners.vue'

        const props = withDefaults(
          defineProps<{
            open: boolean
            title: string
            confirmLabel: string
            /** 540px instead of 440px (Apply dialog). */
            wide?: boolean
            /** data-testid of the dialog; buttons get `<testid>-cancel` / `<testid>-confirm`. */
            testid?: string
          }>(),
          { wide: false, testid: 'confirm-dialog' },
        )

        const emit = defineEmits<{
          confirm: []
          cancel: []
        }>()

        const cancelButton = ref<HTMLButtonElement | null>(null)

        watch(
          () => props.open,
          async (open) => {
            if (open) {
              await nextTick()
              cancelButton.value?.focus()
            }
          },
        )
        </script>

        <template>
          <Teleport to="body">
            <div
              v-if="open"
              class="dialog-backdrop app-dialog-backdrop"
              @click.self="emit('cancel')"
              @keydown.esc="emit('cancel')"
            >
              <div
                class="dialog blueprint app-dialog"
                :class="{ 'app-dialog--wide': wide }"
                role="dialog"
                aria-modal="true"
                :aria-label="title"
                :data-testid="testid"
              >
                <BlueprintCorners />
                <div class="dialog-title">{{ title }}</div>
                <slot />
                <div class="dialog-actions">
                  <button
                    ref="cancelButton"
                    type="button"
                    class="btn btn-secondary"
                    :data-testid="`${testid}-cancel`"
                    @click="emit('cancel')"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    class="btn btn-primary blueprint"
                    :data-testid="`${testid}-confirm`"
                    @click="emit('confirm')"
                  >
                    <BlueprintCorners />
                    {{ confirmLabel }}
                  </button>
                </div>
              </div>
            </div>
          </Teleport>
        </template>
      frontend/src/components/ToastStack.vue: |
        <script setup lang="ts">
        import BlueprintCorners from './BlueprintCorners.vue'
        import { useToastStore } from '../stores/toasts'

        const toasts = useToastStore()
        </script>

