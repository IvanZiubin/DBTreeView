docs_and_tests_updates:
  frontend_claude_md:   # frontend/CLAUDE.md (docs-and-tests rewrites the affected lines)
    - "Layout: add `src/cache/pending.ts` (pure pending-change logic: validateValue, propagateDeletes, nodeStatus, buildApplyPlan, settleApplied, re-key helpers) next to model.ts / hierarchy.ts; `src/components/NodeValueDialog.vue` (Edit / Add child dialog); tests `src/cache/pending.test.ts`, `src/stores/cache.pending.test.ts`, `src/stores/dbTree.test.ts`, `src/dependencyPins.test.ts`."
    - "Layout: cache store line no longer says edit/add/delete/apply are stubs; it now: load, refresh, hierarchy, expansion, pending edit/add/delete, apply; `src/stores/dbTree.ts` has `refresh()` used after Apply."
    - "Conventions: pending-change rules live in src/cache/pending.ts (pure); the store only orchestrates. `propagateDeletes` must run after every merge and every delete."
    - "Conventions: apply always sends refreshIds = every cached real id (client_rules.refresh_ids); on failure the cache state must stay untouched; on success settle -> re-key -> mergeServerNodes, in that order."
    - "Conventions: temp ids are `tmp-<n>` from nextTempSeq; real ids are opaque (only from idMap / server) and may have gaps — never compute ids."
    - "Conventions: Edit / Add child / Delete are disabled and rejected for effectively deleted nodes (isDeleted || isPendingDelete || such a cached ancestor) and while applying."
    - "Conventions: primevue 4.3.3 + @primeuix/themes 1.0.3 + @primeuix/styles 1.0.3 (dependencies AND overrides) are pinned together; src/dependencyPins.test.ts fails if they drift — upgrade only together, via a plan."
    - "Design decisions: add link docs/plans/stage-4-frontend.md."
  readme_frontend_outline:   # sections/sentences docs-and-tests puts into the final README.md (frontend part)
    - "UI usage: select a DB node -> Load into cache; in the cache select a node -> Edit / Add child / Delete; changes are tagged new / edited / to delete and stay local until Apply; Apply sends one transactional batch; Reset restores the sample data and clears the cache."
    - "Cache hierarchy: flat node map; each node shown under its nearest cached ancestor (ancestorIds from GET /api/nodes/{id}); '…' marker for levels that are not loaded."
    - "Pending changes: temp ids tmp-<n> (also for children of new nodes), mapped to real ids from the apply response idMap; delete cascades to every cached descendant immediately and to never-loaded descendants in the DB on Apply; nodes loaded later under a node marked for deletion are shown as to delete; deleted / to-delete nodes cannot be edited."
    - "Edge cases: edits and new children under a node marked for deletion are not sent (they would end up deleted anyway); after Apply every cached node is refreshed (refreshIds) so cascaded deletions show without reloading; a failed Apply keeps all pending changes."
    - "Frontend tests: `cd frontend && npm test` (Vitest, Node env: hierarchy, pending-change logic, stores with mocked API, PrimeVue pin guard)."

cross_plan_notes:
  - "Consumes api-contract v2 + client_rules as-is: POST /api/nodes/apply with top-most deletes, refreshIds = every real cached id ascending, adds with parentId / parentTempId. Matches the request shapes asserted by backend ApplyClientFlowTests (stage-4-backend)."
  - "409/404 nodeIds are not highlighted (optional per client_rules.failure_handling); the toast shows ProblemDetails title/detail (ApiError.detail)."
  - "Stage 5 restyle must keep: NodeLabel status values (clean/new/edited/pending-delete/deleted), data-status / data-testid attributes, store API (editValue/addChild/deleteNode/apply/canModifySelected/pendingCount) and dbTree.refresh after Apply; it replaces NodeValueDialog by the design's inline editor."
