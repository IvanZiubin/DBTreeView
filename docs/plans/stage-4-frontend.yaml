test_matrix:
  owner: docs-and-tests (workflow test phase); the implementer writes only S2 (smoke) and S3 (complete pin guard)
  conventions:
    - Files - src/cache/pending.test.ts (extend S2; keep the smoke test), src/stores/cache.pending.test.ts (new), src/stores/dbTree.test.ts (new). Do not edit src/stores/cache.test.ts, src/cache/hierarchy.test.ts or src/dependencyPins.test.ts.
    - Explicit imports from 'vitest' (describe, it, expect, beforeEach, vi); no globals; Node environment; no jsdom, no component mounting.
    - "Store tests mock the API module at the top of the file: `vi.mock('../api/client', () => ({ applyChanges: vi.fn() }))` in cache.pending.test.ts and `vi.mock('../api/client', () => ({ getRoots: vi.fn(), getChildren: vi.fn() }))` in dbTree.test.ts; import the mocked functions from '../api/client' and use vi.mocked(fn).mockResolvedValueOnce / mockRejectedValueOnce / mockReturnValueOnce(deferred promise). beforeEach: setActivePinia(createPinia()) and vi.mocked(fn).mockReset()."
    - Seed-shaped fixtures (ids and ancestorIds from backend SeedData) - 1 [], 2 [], 3 [], 4 [1], 5 [1], 10 [1,4], 18 [1,4,10], 26 [1,4,10,18], 27 [1,4,10,18]. NodeDetails value `Node <id>` unless stated.
    - Test files must type-check under tsconfig.app.json strict rules (npm run build).
  pending_cases:   # src/cache/pending.ts, plain objects (use the S2 `node` helper)
    - { id: P1, case: "validateValue", given: "'', '   ', ' a ', 'x'.repeat(200), 'x'.repeat(201), ' ' + 'x'.repeat(200) + ' '", expect: "error 'Value must not be empty.' twice; null; null; 'Value must be at most 200 characters.'; null" }
    - { id: P2, case: "nodeStatus priority", given: "flags {isDeleted,isPendingDelete,isNew,isEdited} combos", expect: "isDeleted wins -> 'deleted'; then 'pending-delete'; new+edited -> 'new'; edited -> 'edited'; none -> 'clean'" }
    - { id: P3, case: "pending delete cascades to cached descendants across gaps", given: "1, 10 (isPendingDelete), 26 (anc [1,4,10,18]; 18 uncached), 5", expect: "26.isPendingDelete true; 1 and 5 false" }
    - { id: P4, case: "temp nodes under pending delete", given: "10 pending, tmp-1 (anc [1,4,10]), tmp-2 (anc [1,4,10,'tmp-1'])", expect: "both temp isPendingDelete true" }
    - { id: P5, case: "derived isDeleted + normalisation", given: "10 isDeleted; 26 real with isEdited true, value 'Local', originalValue 'Node 26', isPendingDelete true; tmp-1 under 26", expect: "26.isDeleted true, isPendingDelete false, isEdited false, value 'Node 26'; tmp-1.isPendingDelete true, tmp-1.isDeleted false" }
    - { id: P6, case: "order independence", given: "same set as P3 inserted into the record in reverse key order", expect: "identical flags to P3" }
    - { id: P7, case: "top-most deletes only", given: "1, 4, 10 all isPendingDelete; 2 isPendingDelete", expect: "request.deletes [1, 2]; pendingDeleteKeys ['1','2','4','10']" }
    - { id: P8, case: "already-deleted pending node not sent", given: "10 isDeleted true and isPendingDelete true (set after construction, no propagate)", expect: "deletes []; pendingDeleteKeys ['10']" }
    - { id: P9, case: "edits filter", given: "4 isEdited value 'A'; 10 isEdited + isPendingDelete; 26 isEdited under pending 10; 5 isEdited + isDeleted", expect: "edits [{id:4,value:'A'}]; editedKeys ['4']; discardedEditKeys ['5','10','26']" }
    - { id: P10, case: "adds with parentId / parentTempId in creation order", given: "4; tmp-2 (anc [1,4], parent 4); tmp-10 (anc [1,4,'tmp-2'], parent 'tmp-2')", expect: "adds [{tempId:'tmp-2',parentId:4,value},{tempId:'tmp-10',parentTempId:'tmp-2',value}]; no parentTempId key on the first, no parentId key on the second" }
