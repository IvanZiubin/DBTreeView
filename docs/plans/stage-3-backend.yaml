backend_claude_md_points:   # input for docs-and-tests when updating backend/CLAUDE.md (replace the "501 stub" line)
  - "Apply layout: Features/Apply/ — ApplyEndpoints (MapGroup /api/nodes, body read manually from HttpRequest so bad/missing body -> 400 key 'body'), ApplyDtos (wire types, all nullable), ApplyValidator (pure, JSON-path error keys, limits, Kahn topological order), ApplyCommand (validated command + ApplyOutcome), ApplySql (raw set-based SQL), ApplyService (transaction), ApplyProblems (400/404/409)."
  - "Apply order inside one transaction: advisory lock -> SELECT ... FOR UPDATE referenced rows -> 404 -> 409 -> adds (ids pre-allocated via nextval, one INSERT ... unnest) -> edits (one UPDATE ... unnest) -> cascade delete (one recursive CTE) -> NodeDetails for all referenced ids (one recursive CTE) -> COMMIT."
  - "Lock rule: every tree write transaction (Apply, Reset, SeedIfEmpty, any future writer) calls DbLocks.AcquireTreeWriteLockAsync(db, ct) as its FIRST statement after BeginTransactionAsync. Key DbLocks.TreeWriteLockKey = 4242, defined only there."
  - "Invariant: every descendant of a deleted node is deleted (cascade + 409 on add under deleted parent + lock)."
  - "No more 501: POST /api/nodes/apply is fully implemented; ProblemTypes has BadRequest, NotFound, Conflict, ServiceUnavailable. 404/409 bodies carry a sorted nodeIds extension."
  - "Compose host ports overridable: DB_PORT (5432), API_PORT (8080), UI_PORT (3000)."
  - "Apply tests: tests/TreeEditor.Api.Tests/Apply/*.cs per test_matrix in docs/plans/stage-3-backend.yaml; the atomicity test installs and drops its own trigger (Reset does not remove triggers)."

claude_md_decision_line: "Writes serialized: Apply, Reset and startup seed take pg_advisory_xact_lock(4242) (DbLocks.TreeWriteLockKey) as the first statement of their transaction; apply SQL is set-based raw Npgsql on EF's connection — see docs/plans/stage-3-backend.md#decision-record-4--write-serialization-concurrency"

