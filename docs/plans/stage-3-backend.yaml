# ---------------------------------------------------------------------------
# Test matrix — implemented by docs-and-tests (NOT by plan-implementer).
# Infrastructure from stage 2: every class derives IntegrationTestBase (DB reset
# to seed before each test) and carries [Collection(ApiCollection.Name)].
# Send bodies as raw JSON strings via
#   new StringContent(json, Encoding.UTF8, "application/json")
# so shape errors can be produced. Deserialize success bodies with
# ReadFromJsonAsync<TreeEditor.Api.Features.Apply.ApplyResponse>(); 400 bodies with
# ReadFromJsonAsync<Microsoft.AspNetCore.Http.HttpValidationProblemDetails>();
# 404/409 with ReadFromJsonAsync<Microsoft.AspNetCore.Mvc.ProblemDetails>() and
# read "nodeIds" from problem.Extensions (JsonElement). Seed: ids 1..30, next id 31.
# Subtree of 1 = {1,4,5,6,10,11,12,13,18,19,20,21,26,27} (14 nodes).
# Invariant SQL (must return 0):
#   SELECT count(*) FROM nodes c JOIN nodes p ON p.id = c.parent_id WHERE p.is_deleted AND NOT c.is_deleted
# ---------------------------------------------------------------------------
test_matrix:
  files:
    - path: backend/tests/TreeEditor.Api.Tests/Apply/ApplyHappyPathTests.cs
      cases:
        - "Empty request {\"edits\":[],\"adds\":[],\"deletes\":[]} -> 200, body exactly {\"idMap\":{},\"nodes\":[]}"
        - "refreshIds only: {\"edits\":[],\"adds\":[],\"deletes\":[],\"refreshIds\":[3,999999,3]} -> 200; nodes == [node 3] (missing id ignored, duplicates removed); DB unchanged"
        - "Edit trims value: edits [{id:11,value:\"  Desktop PCs  \"}] -> 200; nodes[0].value \"Desktop PCs\"; GET /api/nodes/11 value \"Desktop PCs\""
        - "Add under real parent: adds [{tempId:\"tmp-1\",parentId:30,value:\"New\"}] -> idMap {tmp-1:31}; nodes [31] with parentId 30, ancestorIds [3,9,17,25,30], hasChildren false, isDeleted false"
        - "Temp-id chain, request order reversed: adds [{tmp-2,parentTempId tmp-1,\"Grandchild\"},{tmp-1,parentId 11,\"Child\"}] -> idMap {tmp-1:31,tmp-2:32}; node 32 ancestorIds [1,4,11,31]; node 31 hasChildren true"
        - "Three-level chain plus sibling: adds [{a,parentId 2},{b,parentTempId a},{c,parentTempId b},{d,parentId 3}] -> ids a=31,d=32,b=33,c=34 (breadth-first insert order); every child id greater than its parent id"
        - "Response contains edit ids, delete ids, created ids and refreshIds, de-duplicated and ordered by id ascending (edits [5], deletes [27], adds [{t,parentId 2}], refreshIds [27,1,5] -> ids [1,5,27,31])"
        - "Mixed batch edit + add + delete of unrelated nodes all persist (verify via GET /api/nodes/{id})"
        - "Raw JSON response has property names idMap, nodes, id, parentId, value, isDeleted, hasChildren, ancestorIds (camelCase)"
    - path: backend/tests/TreeEditor.Api.Tests/Apply/ApplyCascadeTests.cs
      cases:
        - "Delete 1 cascades to never-loaded descendants: deletes [1] -> 200; via WithDbAsync all 14 subtree ids have IsDeleted true and nodes 2,3 and their subtrees stay false; GET /api/nodes/26 isDeleted true"
        - "refreshIds cascade visibility: deletes [1], refreshIds [26,27,2] -> nodes 1,2,26,27 with 26 and 27 isDeleted true, 2 false"
        - "Cascade covers nodes added in an earlier apply: apply add under 26 (gets 31), then apply deletes [4] -> node 31 isDeleted true"
        - "Same batch add under a node deleted in the same batch: adds [{t1,parentId 10},{t2,parentTempId t1}], deletes [4] -> 200; idMap has t1,t2; both created nodes come back isDeleted true"
        - "Same batch edit of a descendant of a deleted node: edits [{26,\"x\"}], deletes [10] -> 200; node 26 value \"x\" and isDeleted true"
        - "Idempotent re-delete: deletes [1] then deletes [1,1,26] -> both 200; second response nodes [1,26] isDeleted true; deleted count unchanged (14)"
        - "Duplicate ids in deletes are de-duplicated (no error): deletes [5,5] -> 200, nodes [5]"
        - "Invariant SQL returns 0 after every test in this file"
    - path: backend/tests/TreeEditor.Api.Tests/Apply/ApplyValidationTests.cs
      cases:
        - "No body (PostAsync with null content) -> 400 application/problem+json; errors has key \"body\""
        - "Body with Content-Type text/plain containing valid JSON -> NOT 415 (200 for an empty request)"
        - "Malformed JSON \"{\\\"edits\\\":\" -> 400 key \"body\"; JSON literal null -> 400 key \"body\"; JSON array [] -> 400 key \"body\""
        - "Wrong type: {\"edits\":[{\"id\":\"abc\",\"value\":\"x\"}],\"adds\":[],\"deletes\":[]} -> 400 key \"body\""
        - "Missing arrays: {} -> 400 with keys edits, adds, deletes; refreshIds omitted is fine"
        - "Value rules: \"   \" -> key edits[0].value; 201 chars after trim -> edits[0].value; exactly 200 chars -> 200; value missing -> edits[0].value; same three for adds[0].value"
        - "Value length counted in code points: 200 emoji (U+1F600, 400 UTF-16 chars) -> 200 OK; 201 emoji -> 400"
        - "Value with NUL \\u0000 -> 400 edits[0].value"
        - "Edit id missing -> edits[0].id; duplicate edit id (edits [{2,a},{2,b}]) -> key edits[1].id"
        - "tempId empty -> adds[0].tempId; tempId 65 chars -> adds[0].tempId; 64 chars -> OK; duplicate tempId -> adds[1].tempId"
        - "Neither parentId nor parentTempId -> key adds[0]; both set -> key adds[0]"
        - "Unknown parentTempId -> key adds[0].parentTempId"
        - "Cycle: adds [{a,parentTempId b},{b,parentTempId a}] -> keys adds[0].parentTempId and adds[1].parentTempId; self-cycle {a,parentTempId a} -> adds[0].parentTempId"
        - "Limits: 1001 edits -> key edits; 1001 adds -> adds; 1001 deletes -> deletes; 10001 refreshIds -> refreshIds; exactly 1000 deletes of ids 1..1000 is not a 400 (expect 404 for the missing ids 31..1000)"
        - "400 is returned before DB access: body with an invalid value AND a missing edit id 999999 -> 400 (not 404); nothing persisted"
        - "Validation response: status 400, title \"One or more validation errors occurred.\", type https://tools.ietf.org/html/rfc9110#section-15.5.1"
    - path: backend/tests/TreeEditor.Api.Tests/Apply/ApplyErrorTests.cs
      cases:
        - "404 edit of missing id 999999 -> 404 problem+json, title \"Not Found\", nodeIds [999999]"
        - "404 delete of missing id; 404 add with parentId 999999; multiple missing ids -> nodeIds sorted ascending"
        - "409 edit of a node already deleted (arrange: WithDbAsync set node 5 IsDeleted true) -> 409, title \"Conflict\", nodeIds [5]"
        - "409 add under an already-deleted real parent -> 409 nodeIds [parent]"
        - "Precedence 404 over 409: edits [{5 (deleted),x}], deletes [999999] -> 404"
        - "Nothing persisted on 404/409: request also containing a valid add and a valid edit -> after the error Nodes.Count()==30 and the edited value unchanged"
    - path: backend/tests/TreeEditor.Api.Tests/Apply/ApplyAtomicityTests.cs
      cases:
        - >-
          Rollback on a failing later operation: in WithDbAsync ExecuteSqlRawAsync create
          FUNCTION test_fail_on_boom() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN IF NEW.value = 'boom' THEN RAISE EXCEPTION 'boom'; END IF; RETURN NEW; END; $$
          and TRIGGER trg_test_fail_on_boom BEFORE UPDATE OF value ON nodes FOR EACH ROW EXECUTE FUNCTION test_fail_on_boom().
          Apply adds [{t1,parentId 2,"New"}], edits [{3,"boom"}], deletes [7] -> 500 problem+json.
          Assert: Nodes.Count()==30, node 3 value "Home and Garden", node 7 IsDeleted false.
          In finally: DROP TRIGGER IF EXISTS trg_test_fail_on_boom ON nodes; DROP FUNCTION IF EXISTS test_fail_on_boom() (Reset does not drop triggers).
          Do not assert the next generated id (sequence values are consumed even on rollback).
    - path: backend/tests/TreeEditor.Api.Tests/Apply/ApplyConcurrencyTests.cs
      cases:
        - >-
          Advisory lock blocks apply: open a separate NpgsqlConnection to Factory.ConnectionString, run SELECT pg_advisory_lock(4242)
          (use DbLocks.TreeWriteLockKey); start POST apply (empty request) without awaiting; Task.WhenAny with Task.Delay(500) -> apply not completed;
          SELECT pg_advisory_unlock(4242); apply completes with 200 within 5 s.
        - Same as above for POST /api/reset (Reset takes the same lock).
        - >-
          Parallel add vs ancestor cascade, 10 rounds: each round Factory.ResetDatabaseAsync(); start in parallel
          A = apply adds [{t,parentId 26,"race"}] and B = apply deletes [1]; await both.
          B is 200; A is 200 or 409; if A is 200 the created node is isDeleted true in DB; invariant SQL returns 0.
    - path: backend/tests/TreeEditor.Api.Tests/Reset/ResetTests.cs
      cases_to_add:
        - "Reset after apply restores seed: apply edits [{1,\"x\"}], adds [{t,parentId 30}], deletes [2] -> POST /api/reset -> 30 rows equal SeedData, none deleted; next apply add under 30 gets idMap value 31"
  must_pass_command: "cd backend && dotnet test TreeEditor.sln"

