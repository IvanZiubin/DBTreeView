# Stage 3 backend plan — executable literally. Human rationale: docs/plans/stage-3-backend.md
stage: 3
name: cache-core
project: backend

scope:
  implementer_may_write:
    - backend/
    - docker-compose.yml
  implementer_must_not_write:
    - frontend/
    - docs/
    - CLAUDE.md
    - backend/CLAUDE.md
    - README.md

environment:
  os: macOS
  dotnet_sdk: 8.0.422
  docker: "Docker Desktop, compose v2"
  all_paths_relative_to_repo_root: /Users/maczone/Desktop/personal/test_qit

fixed_versions:
  target_framework: net8.0
  new_nuget_packages: none   # Npgsql 8 (via Npgsql.EntityFrameworkCore.PostgreSQL 8.0.11) already provides NpgsqlCommand / NpgsqlDbType
  schema_or_migration_changes: none

prerequisites:
  scaffold_commands: []      # nothing for chore-runner; no packages, no scaffolding
  must_hold_before_start:
    - "Stage 2 is committed; `cd backend && dotnet build TreeEditor.sln` succeeds."
    - Docker Desktop is running.

# ---------------------------------------------------------------------------
# Implementation steps (plan-implementer, scope backend/ + docker-compose.yml).
# "create" = write a new file with exactly this content. "replace" = overwrite
# the existing file with exactly this content. "delete" = remove the file.
# Do not touch any file not listed here.
# ---------------------------------------------------------------------------
steps:
  - id: 1
    title: Shared problem types and the tree write lock
    files:
      - { path: backend/src/TreeEditor.Api/Infrastructure/ProblemTypes.cs, action: replace }
      - { path: backend/src/TreeEditor.Api/Infrastructure/DbLocks.cs, action: create }
    instructions:
      - path: backend/src/TreeEditor.Api/Infrastructure/ProblemTypes.cs
        content: |
          namespace TreeEditor.Api.Infrastructure;

          public static class ProblemTypes
          {
              public const string BadRequest = "https://tools.ietf.org/html/rfc9110#section-15.5.1";
              public const string NotFound = "https://tools.ietf.org/html/rfc9110#section-15.5.5";
              public const string Conflict = "https://tools.ietf.org/html/rfc9110#section-15.5.10";
              public const string ServiceUnavailable = "https://tools.ietf.org/html/rfc9110#section-15.6.4";
          }
      - path: backend/src/TreeEditor.Api/Infrastructure/DbLocks.cs
        content: |
          using Microsoft.EntityFrameworkCore;
          using TreeEditor.Api.Data;

          namespace TreeEditor.Api.Infrastructure;

          /// <summary>
          /// Transaction-scoped PostgreSQL advisory lock that serializes every tree write
          /// (POST /api/nodes/apply, POST /api/reset, startup seed). Must be the first statement
          /// after BEGIN; released automatically on COMMIT or ROLLBACK.
          /// </summary>
          public static class DbLocks
          {
              public const long TreeWriteLockKey = 4242;

              public static Task AcquireTreeWriteLockAsync(TreeDbContext db, CancellationToken ct) =>
                  db.Database.ExecuteSqlAsync($"SELECT pg_advisory_xact_lock({TreeWriteLockKey})", ct);
          }
    done_when:
      - Both files have exactly the content above; ProblemTypes no longer contains NotImplemented.

  - id: 2
    title: Seeder takes the write lock (Reset and SeedIfEmpty)
    files:
      - { path: backend/src/TreeEditor.Api/Data/TreeSeeder.cs, action: replace }
    instructions:
      - note: >
          Only change versus stage 2: both public methods take DbLocks.AcquireTreeWriteLockAsync as the first
          statement of their transaction, and SeedIfEmptyAsync checks emptiness inside the locked transaction.
          ResetEndpoints.cs is NOT changed (it already calls seeder.ResetAsync).
      - path: backend/src/TreeEditor.Api/Data/TreeSeeder.cs
        content: |
          using Microsoft.EntityFrameworkCore;
          using Npgsql;
          using TreeEditor.Api.Infrastructure;

          namespace TreeEditor.Api.Data;

          public sealed class TreeSeeder(TreeDbContext db)
          {
              private const string InsertSeedSql = """
                  INSERT INTO nodes (id, parent_id, value, is_deleted)
                  SELECT s.id, NULLIF(s.parent_id, 0), s.value, FALSE
                  FROM unnest(@nodeIds, @parentIds, @nodeValues) AS s(id, parent_id, value)
                  """;

              private const string RestartSequenceSql =
                  "SELECT setval(pg_get_serial_sequence('nodes', 'id'), (SELECT MAX(id) FROM nodes))";

              private const string TruncateSql = "TRUNCATE TABLE nodes RESTART IDENTITY";

              /// <summary>Inserts the seed when the table is empty. Returns true if it seeded.</summary>
              public async Task<bool> SeedIfEmptyAsync(CancellationToken ct)
              {
                  await using var tx = await db.Database.BeginTransactionAsync(ct);
                  await DbLocks.AcquireTreeWriteLockAsync(db, ct);

                  if (await db.Nodes.AnyAsync(ct))
                  {
                      return false;
                  }

                  await InsertSeedAsync(ct);
                  await tx.CommitAsync(ct);
                  return true;
              }

              /// <summary>Deletes all rows and restores the seed with fixed ids, in one transaction.</summary>
              public async Task ResetAsync(CancellationToken ct)
              {
                  await using var tx = await db.Database.BeginTransactionAsync(ct);
                  await DbLocks.AcquireTreeWriteLockAsync(db, ct);
                  await db.Database.ExecuteSqlRawAsync(TruncateSql, ct);
                  await InsertSeedAsync(ct);
                  await tx.CommitAsync(ct);
                  db.ChangeTracker.Clear();
              }

              private async Task InsertSeedAsync(CancellationToken ct)
              {
                  var nodeIds = SeedData.Nodes.Select(n => n.Id).ToArray();
                  var parentIds = SeedData.Nodes.Select(n => n.ParentId ?? 0L).ToArray();
                  var nodeValues = SeedData.Nodes.Select(n => n.Value).ToArray();

                  await db.Database.ExecuteSqlRawAsync(
                      InsertSeedSql,
                      new object[]
                      {
                          new NpgsqlParameter("nodeIds", nodeIds),
                          new NpgsqlParameter("parentIds", parentIds),
                          new NpgsqlParameter("nodeValues", nodeValues),
                      },
                      ct);

                  await db.Database.ExecuteSqlRawAsync(RestartSequenceSql, ct);
              }
          }
    done_when:
      - File has exactly the content above.

  - id: 3
    title: Apply wire DTOs and validated command / outcome types
    files:
      - { path: backend/src/TreeEditor.Api/Features/Apply/ApplyDtos.cs, action: create }
      - { path: backend/src/TreeEditor.Api/Features/Apply/ApplyCommand.cs, action: create }
    instructions:
      - path: backend/src/TreeEditor.Api/Features/Apply/ApplyDtos.cs
        content: |
          using TreeEditor.Api.Features.Nodes;

          namespace TreeEditor.Api.Features.Apply;

          /// <summary>
          /// Body of POST /api/nodes/apply. Every member is nullable so the validator can report
          /// missing fields as 400 with a JSON-path key instead of silently using defaults.
          /// </summary>
          public sealed class ApplyRequest
          {
              public List<ApplyEditItem?>? Edits { get; init; }

              public List<ApplyAddItem?>? Adds { get; init; }

              public List<long>? Deletes { get; init; }

              public List<long>? RefreshIds { get; init; }
          }

          public sealed class ApplyEditItem
          {
              public long? Id { get; init; }

              public string? Value { get; init; }
          }

          public sealed class ApplyAddItem
          {
              public string? TempId { get; init; }

              public long? ParentId { get; init; }

              public string? ParentTempId { get; init; }

              public string? Value { get; init; }
          }

          /// <summary>idMap: tempId -> real id (insert order). nodes: post-apply NodeDetails ordered by id.</summary>
          public sealed record ApplyResponse(IReadOnlyDictionary<string, long> IdMap, IReadOnlyList<NodeDetailsDto> Nodes);
      - path: backend/src/TreeEditor.Api/Features/Apply/ApplyCommand.cs
        content: |
          namespace TreeEditor.Api.Features.Apply;

          public sealed record ValidatedEdit(long Id, string Value);

          /// <summary>Exactly one of ParentId / ParentTempId is non-null. Value is already trimmed.</summary>
          public sealed record ValidatedAdd(string TempId, long? ParentId, string? ParentTempId, string Value);

          /// <summary>
          /// A request that passed validation. Adds are in insert order (parents before children);
          /// DeleteIds and RefreshIds are de-duplicated.
          /// </summary>
          public sealed record ApplyCommand(
              IReadOnlyList<ValidatedEdit> Edits,
              IReadOnlyList<ValidatedAdd> Adds,
              IReadOnlyList<long> DeleteIds,
              IReadOnlyList<long> RefreshIds);

          public abstract record ApplyOutcome
          {
              public sealed record Success(ApplyResponse Response) : ApplyOutcome;

              /// <summary>Referenced real ids that do not exist, sorted ascending.</summary>
              public sealed record NotFound(IReadOnlyList<long> NodeIds) : ApplyOutcome;

              /// <summary>Edit targets / real add parents already deleted before the request, sorted ascending.</summary>
              public sealed record Conflict(IReadOnlyList<long> NodeIds) : ApplyOutcome;
          }
    done_when:
      - Both files have exactly the content above.

  - id: 4
    title: Validator (pure, runs before any DB access)
    files:
      - { path: backend/src/TreeEditor.Api/Features/Apply/ApplyValidator.cs, action: create }
    instructions:
      - path: backend/src/TreeEditor.Api/Features/Apply/ApplyValidator.cs
        content: |
          using System.Diagnostics.CodeAnalysis;

          namespace TreeEditor.Api.Features.Apply;

          /// <summary>
          /// Shape and value validation of an apply request (contract v2 apply_semantics). No database access.
          /// Error keys are JSON paths: edits, adds, deletes, refreshIds, edits[i], edits[i].id, edits[i].value,
          /// adds[i], adds[i].tempId, adds[i].parentTempId, adds[i].value.
          /// </summary>
          public static class ApplyValidator
          {
              public const int MaxEdits = 1000;
              public const int MaxAdds = 1000;
              public const int MaxDeletes = 1000;
              public const int MaxRefreshIds = 10000;
              public const int MaxTempIdLength = 64;
              public const int MaxValueLength = 200;

              public static bool TryValidate(
                  ApplyRequest request,
                  [NotNullWhen(true)] out ApplyCommand? command,
                  out Dictionary<string, string[]> errors)
              {
                  var found = new Dictionary<string, List<string>>(StringComparer.Ordinal);

                  CheckArray(request.Edits, "edits", MaxEdits, required: true, found);
                  CheckArray(request.Adds, "adds", MaxAdds, required: true, found);
                  CheckArray(request.Deletes, "deletes", MaxDeletes, required: true, found);
                  CheckArray(request.RefreshIds, "refreshIds", MaxRefreshIds, required: false, found);

                  var edits = new List<ValidatedEdit>();
                  var adds = new List<ValidatedAdd>();
                  if (found.Count == 0)
                  {
                      edits = ValidateEdits(request.Edits!, found);
                      adds = ValidateAdds(request.Adds!, found);
                  }

                  if (found.Count > 0)
                  {
                      command = null;
                      errors = found.ToDictionary(kv => kv.Key, kv => kv.Value.ToArray(), StringComparer.Ordinal);
                      return false;
                  }

                  command = new ApplyCommand(
                      edits,
                      adds,
                      request.Deletes!.Distinct().ToArray(),
                      request.RefreshIds?.Distinct().ToArray() ?? Array.Empty<long>());
                  errors = new Dictionary<string, string[]>(StringComparer.Ordinal);
                  return true;
              }

              private static void CheckArray<T>(
                  List<T>? items,
                  string key,
                  int max,
                  bool required,
                  Dictionary<string, List<string>> errors)
              {
                  if (items is null)
                  {
                      if (required)
                      {
                          AddError(errors, key, $"The '{key}' array is required.");
                      }

                      return;
                  }

                  if (items.Count > max)
                  {
                      AddError(errors, key, $"At most {max} items are allowed in '{key}'.");
                  }
              }

              private static List<ValidatedEdit> ValidateEdits(
                  List<ApplyEditItem?> items,
                  Dictionary<string, List<string>> errors)
              {
                  var result = new List<ValidatedEdit>(items.Count);
                  var seenIds = new HashSet<long>();

                  for (var i = 0; i < items.Count; i++)
                  {
                      var path = $"edits[{i}]";
                      var item = items[i];
                      if (item is null)
                      {
                          AddError(errors, path, "Edit item must not be null.");
                          continue;
                      }

                      if (item.Id is not { } id)
                      {
                          AddError(errors, $"{path}.id", "id is required.");
                      }
                      else if (!seenIds.Add(id))
                      {
                          AddError(errors, $"{path}.id", $"Duplicate edit id {id}.");
                      }

                      var value = NormalizeValue(item.Value, $"{path}.value", errors);
                      if (item.Id is { } validId && value is not null)
                      {
                          result.Add(new ValidatedEdit(validId, value));
                      }
                  }

                  return result;
              }

              private static List<ValidatedAdd> ValidateAdds(
                  List<ApplyAddItem?> items,
                  Dictionary<string, List<string>> errors)
              {
                  // All add error keys start with "adds[", so a growing key count means an add failed.
                  var keyCountBefore = errors.Count;
                  var indexByTempId = new Dictionary<string, int>(StringComparer.Ordinal);
                  var values = new string?[items.Count];

                  for (var i = 0; i < items.Count; i++)
                  {
                      var path = $"adds[{i}]";
                      var item = items[i];
                      if (item is null)
                      {
                          AddError(errors, path, "Add item must not be null.");
                          continue;
                      }

                      if (string.IsNullOrEmpty(item.TempId))
                      {
                          AddError(errors, $"{path}.tempId", "tempId is required and must not be empty.");
                      }
                      else if (item.TempId.Length > MaxTempIdLength)
                      {
                          AddError(errors, $"{path}.tempId", $"tempId must be at most {MaxTempIdLength} characters.");
                      }
                      else if (!indexByTempId.TryAdd(item.TempId, i))
                      {
                          AddError(errors, $"{path}.tempId", $"Duplicate tempId '{item.TempId}'.");
                      }

                      if ((item.ParentId is null) == (item.ParentTempId is null))
                      {
                          AddError(errors, path, "Exactly one of parentId or parentTempId must be set.");
                      }

                      values[i] = NormalizeValue(item.Value, $"{path}.value", errors);
                  }

                  if (errors.Count > keyCountBefore)
                  {
                      return new List<ValidatedAdd>();
                  }

                  for (var i = 0; i < items.Count; i++)
                  {
                      var parentTempId = items[i]!.ParentTempId;
                      if (parentTempId is not null && !indexByTempId.ContainsKey(parentTempId))
                      {
                          AddError(
                              errors,
                              $"adds[{i}].parentTempId",
                              $"Unknown parentTempId '{parentTempId}': no add in this request has that tempId.");
                      }
                  }

                  if (errors.Count > keyCountBefore)
                  {
                      return new List<ValidatedAdd>();
                  }

                  // Kahn's algorithm, breadth-first: real-parent adds in request order, then their
                  // temp children level by level in request order. Parents always precede children.
                  var children = new List<int>[items.Count];
                  for (var i = 0; i < items.Count; i++)
                  {
                      children[i] = new List<int>();
                  }

                  var queue = new Queue<int>();
                  for (var i = 0; i < items.Count; i++)
                  {
                      var parentTempId = items[i]!.ParentTempId;
                      if (parentTempId is null)
                      {
                          queue.Enqueue(i);
                      }
                      else
                      {
                          children[indexByTempId[parentTempId]].Add(i);
                      }
                  }

                  var order = new List<int>(items.Count);
                  while (queue.TryDequeue(out var index))
                  {
                      order.Add(index);
                      foreach (var child in children[index])
                      {
                          queue.Enqueue(child);
                      }
                  }

                  if (order.Count < items.Count)
                  {
                      var placed = new HashSet<int>(order);
                      for (var i = 0; i < items.Count; i++)
                      {
                          if (!placed.Contains(i))
                          {
                              AddError(
                                  errors,
                                  $"adds[{i}].parentTempId",
                                  "parentTempId chain forms a cycle and never reaches a real parentId.");
                          }
                      }

                      return new List<ValidatedAdd>();
                  }

                  return order
                      .Select(i =>
                      {
                          var item = items[i]!;
                          return new ValidatedAdd(item.TempId!, item.ParentId, item.ParentTempId, values[i]!);
                      })
                      .ToList();
              }

              /// <summary>Trims and checks length 1..200 in Unicode code points (same unit as PostgreSQL char_length).</summary>
              private static string? NormalizeValue(string? raw, string key, Dictionary<string, List<string>> errors)
              {
                  if (raw is null)
                  {
                      AddError(errors, key, "value is required.");
                      return null;
                  }

                  var trimmed = raw.Trim();
                  if (!TryCountCodePoints(trimmed, out var length))
                  {
                      AddError(errors, key, "value must not contain NUL characters or unpaired surrogates.");
                      return null;
                  }

                  if (length == 0)
                  {
                      AddError(errors, key, "value must not be empty or whitespace only.");
                      return null;
                  }

                  if (length > MaxValueLength)
                  {
                      AddError(errors, key, $"value must be at most {MaxValueLength} characters after trimming.");
                      return null;
                  }

                  return trimmed;
              }

              private static bool TryCountCodePoints(string text, out int count)
              {
                  count = 0;
                  for (var i = 0; i < text.Length; i++)
                  {
                      var c = text[i];
                      if (c == '\0' || char.IsLowSurrogate(c))
                      {
                          return false;
                      }

                      if (char.IsHighSurrogate(c))
                      {
                          if (i + 1 >= text.Length || !char.IsLowSurrogate(text[i + 1]))
                          {
                              return false;
                          }

                          i++;
                      }

                      count++;
                  }

                  return true;
              }

              private static void AddError(Dictionary<string, List<string>> errors, string key, string message)
              {
                  if (!errors.TryGetValue(key, out var messages))
                  {
                      messages = new List<string>();
                      errors[key] = messages;
                  }

                  messages.Add(message);
              }
          }
    done_when:
      - File has exactly the content above and compiles without warnings.

  - id: 5
    title: Apply SQL, problems, service
    files:
      - { path: backend/src/TreeEditor.Api/Features/Apply/ApplySql.cs, action: create }
      - { path: backend/src/TreeEditor.Api/Features/Apply/ApplyProblems.cs, action: create }
      - { path: backend/src/TreeEditor.Api/Features/Apply/ApplyService.cs, action: create }
    instructions:
      - path: backend/src/TreeEditor.Api/Features/Apply/ApplySql.cs
        content: |
          namespace TreeEditor.Api.Features.Apply;

          /// <summary>Set-based SQL used by ApplyService. Parameters are Npgsql named parameters.</summary>
          internal static class ApplySql
          {
              /// <summary>@ids bigint[]. Locks referenced rows in id order; missing ids simply produce no row.</summary>
              public const string LockReferencedNodes = """
                  SELECT id, is_deleted
                  FROM nodes
                  WHERE id = ANY(@ids)
                  ORDER BY id
                  FOR UPDATE
                  """;

              /// <summary>@count integer. Returns @count new ids from the identity sequence, ascending.</summary>
              public const string AllocateIds = """
                  SELECT nextval(pg_get_serial_sequence('nodes', 'id'))
                  FROM generate_series(1, @count)
                  ORDER BY 1
                  """;

              /// <summary>@ids bigint[], @parentIds bigint[], @nodeValues text[]. FK is checked at end of statement.</summary>
              public const string InsertAdds = """
                  INSERT INTO nodes (id, parent_id, value, is_deleted)
                  SELECT a.id, a.parent_id, a.value, FALSE
                  FROM unnest(@ids, @parentIds, @nodeValues) AS a(id, parent_id, value)
                  """;

              /// <summary>@ids bigint[], @nodeValues text[].</summary>
              public const string UpdateEdits = """
                  UPDATE nodes AS n
                  SET value = e.value
                  FROM unnest(@ids, @nodeValues) AS e(id, value)
                  WHERE n.id = e.id
                  """;

              /// <summary>@ids bigint[]. Soft-deletes the ids and all their DB descendants (loaded or not).</summary>
              public const string CascadeDelete = """
                  WITH RECURSIVE subtree AS (
                      SELECT n.id FROM nodes n WHERE n.id = ANY(@ids)
                      UNION
                      SELECT c.id FROM nodes c JOIN subtree s ON c.parent_id = s.id
                  )
                  UPDATE nodes SET is_deleted = TRUE
                  WHERE id IN (SELECT id FROM subtree) AND is_deleted = FALSE
                  """;

              /// <summary>
              /// @ids bigint[]. NodeDetails for every existing id (missing ids are skipped), ordered by id.
              /// Columns: id, parent_id, value, is_deleted, has_children, ancestor_ids (root -> parent).
              /// </summary>
              public const string LoadNodeDetails = """
                  WITH RECURSIVE targets AS (
                      SELECT n.id, n.parent_id, n.value, n.is_deleted
                      FROM nodes n
                      WHERE n.id = ANY(@ids)
                  ),
                  ancestors AS (
                      SELECT t.id AS origin_id, p.id AS ancestor_id, p.parent_id, 1 AS depth
                      FROM targets t
                      JOIN nodes p ON p.id = t.parent_id
                      UNION ALL
                      SELECT a.origin_id, p.id, p.parent_id, a.depth + 1
                      FROM ancestors a
                      JOIN nodes p ON p.id = a.parent_id
                  ),
                  ancestor_lists AS (
                      SELECT origin_id, array_agg(ancestor_id ORDER BY depth DESC) AS ancestor_ids
                      FROM ancestors
                      GROUP BY origin_id
                  )
                  SELECT t.id,
                         t.parent_id,
                         t.value,
                         t.is_deleted,
                         EXISTS (SELECT 1 FROM nodes c WHERE c.parent_id = t.id) AS has_children,
                         COALESCE(l.ancestor_ids, ARRAY[]::bigint[]) AS ancestor_ids
                  FROM targets t
                  LEFT JOIN ancestor_lists l ON l.origin_id = t.id
                  ORDER BY t.id
                  """;
          }
      - path: backend/src/TreeEditor.Api/Features/Apply/ApplyProblems.cs
        content: |
          using TreeEditor.Api.Infrastructure;

          namespace TreeEditor.Api.Features.Apply;

          public static class ApplyProblems
          {
              public static IResult Validation(Dictionary<string, string[]> errors) =>
                  Results.ValidationProblem(
                      errors,
                      detail: "The apply request is invalid; nothing was changed.",
                      statusCode: StatusCodes.Status400BadRequest,
                      title: "One or more validation errors occurred.",
                      type: ProblemTypes.BadRequest);

              public static IResult NotFound(IReadOnlyList<long> nodeIds) =>
                  Results.Problem(
                      detail: $"Node(s) {string.Join(", ", nodeIds)} do not exist; nothing was changed.",
                      statusCode: StatusCodes.Status404NotFound,
                      title: "Not Found",
                      type: ProblemTypes.NotFound,
                      extensions: new Dictionary<string, object?> { ["nodeIds"] = nodeIds.ToArray() });

              public static IResult Conflict(IReadOnlyList<long> nodeIds) =>
                  Results.Problem(
                      detail: $"Node(s) {string.Join(", ", nodeIds)} are already deleted and cannot be edited or receive children; nothing was changed.",
                      statusCode: StatusCodes.Status409Conflict,
                      title: "Conflict",
                      type: ProblemTypes.Conflict,
                      extensions: new Dictionary<string, object?> { ["nodeIds"] = nodeIds.ToArray() });
          }
      - path: backend/src/TreeEditor.Api/Features/Apply/ApplyService.cs
        content: |
          using Microsoft.EntityFrameworkCore;
          using Microsoft.EntityFrameworkCore.Storage;
          using Npgsql;
          using NpgsqlTypes;
          using TreeEditor.Api.Data;
          using TreeEditor.Api.Features.Nodes;
          using TreeEditor.Api.Infrastructure;

          namespace TreeEditor.Api.Features.Apply;

          /// <summary>
          /// Executes a validated apply command in one transaction serialized by DbLocks.
          /// Order: lock -> 404 check -> 409 check -> adds (parents first) -> edits -> cascade deletes -> response.
          /// Returning before CommitAsync disposes the transaction, which rolls back.
          /// </summary>
          public sealed class ApplyService(TreeDbContext db)
          {
              public async Task<ApplyOutcome> ApplyAsync(ApplyCommand command, CancellationToken ct)
              {
                  await using var transaction = await db.Database.BeginTransactionAsync(ct);
                  await DbLocks.AcquireTreeWriteLockAsync(db, ct);

                  var connection = (NpgsqlConnection)db.Database.GetDbConnection();
                  var npgsqlTransaction = (NpgsqlTransaction)transaction.GetDbTransaction();

                  var editIds = command.Edits.Select(e => e.Id).ToArray();
                  var realParentIds = command.Adds
                      .Where(a => a.ParentId.HasValue)
                      .Select(a => a.ParentId.GetValueOrDefault())
                      .ToArray();
                  var referencedIds = editIds.Concat(command.DeleteIds).Concat(realParentIds).Distinct().ToArray();

                  var isDeletedById = await LockNodesAsync(connection, npgsqlTransaction, referencedIds, ct);

                  var missingIds = referencedIds.Where(id => !isDeletedById.ContainsKey(id)).Order().ToArray();
                  if (missingIds.Length > 0)
                  {
                      return new ApplyOutcome.NotFound(missingIds);
                  }

                  var conflictIds = editIds.Concat(realParentIds).Where(id => isDeletedById[id]).Distinct().Order().ToArray();
                  if (conflictIds.Length > 0)
                  {
                      return new ApplyOutcome.Conflict(conflictIds);
                  }

                  var idMap = await InsertAddsAsync(connection, npgsqlTransaction, command.Adds, ct);
                  await UpdateEditsAsync(connection, npgsqlTransaction, command.Edits, ct);
                  await CascadeDeleteAsync(connection, npgsqlTransaction, command.DeleteIds, ct);

                  var responseIds = editIds
                      .Concat(command.DeleteIds)
                      .Concat(idMap.Values)
                      .Concat(command.RefreshIds)
                      .Distinct()
                      .ToArray();
                  var nodes = await LoadNodeDetailsAsync(connection, npgsqlTransaction, responseIds, ct);

                  await transaction.CommitAsync(ct);
                  return new ApplyOutcome.Success(new ApplyResponse(idMap, nodes));
              }

              private static async Task<Dictionary<long, bool>> LockNodesAsync(
                  NpgsqlConnection connection,
                  NpgsqlTransaction transaction,
                  long[] ids,
                  CancellationToken ct)
              {
                  var isDeletedById = new Dictionary<long, bool>(ids.Length);
                  if (ids.Length == 0)
                  {
                      return isDeletedById;
                  }

                  await using var cmd = new NpgsqlCommand(ApplySql.LockReferencedNodes, connection, transaction);
                  cmd.Parameters.Add(BigintArray("ids", ids));
                  await using var reader = await cmd.ExecuteReaderAsync(ct);
                  while (await reader.ReadAsync(ct))
                  {
                      isDeletedById[reader.GetInt64(0)] = reader.GetBoolean(1);
                  }

                  return isDeletedById;
              }

              private static async Task<Dictionary<string, long>> InsertAddsAsync(
                  NpgsqlConnection connection,
                  NpgsqlTransaction transaction,
                  IReadOnlyList<ValidatedAdd> adds,
                  CancellationToken ct)
              {
                  var idMap = new Dictionary<string, long>(adds.Count, StringComparer.Ordinal);
                  if (adds.Count == 0)
                  {
                      return idMap;
                  }

                  var newIds = await AllocateIdsAsync(connection, transaction, adds.Count, ct);

                  var ids = new long[adds.Count];
                  var parentIds = new long[adds.Count];
                  var values = new string[adds.Count];
                  for (var i = 0; i < adds.Count; i++)
                  {
                      var add = adds[i];
                      ids[i] = newIds[i];
                      idMap[add.TempId] = newIds[i];
                      parentIds[i] = add.ParentId ?? idMap[add.ParentTempId!];
                      values[i] = add.Value;
                  }

                  await using var cmd = new NpgsqlCommand(ApplySql.InsertAdds, connection, transaction);
                  cmd.Parameters.Add(BigintArray("ids", ids));
                  cmd.Parameters.Add(BigintArray("parentIds", parentIds));
                  cmd.Parameters.Add(TextArray("nodeValues", values));
                  await cmd.ExecuteNonQueryAsync(ct);

                  return idMap;
              }

              private static async Task<List<long>> AllocateIdsAsync(
                  NpgsqlConnection connection,
                  NpgsqlTransaction transaction,
                  int count,
                  CancellationToken ct)
              {
                  var newIds = new List<long>(count);
                  await using var cmd = new NpgsqlCommand(ApplySql.AllocateIds, connection, transaction);
                  cmd.Parameters.Add(new NpgsqlParameter("count", NpgsqlDbType.Integer) { Value = count });
                  await using var reader = await cmd.ExecuteReaderAsync(ct);
                  while (await reader.ReadAsync(ct))
                  {
                      newIds.Add(reader.GetInt64(0));
                  }

                  return newIds;
              }

              private static async Task UpdateEditsAsync(
                  NpgsqlConnection connection,
                  NpgsqlTransaction transaction,
                  IReadOnlyList<ValidatedEdit> edits,
                  CancellationToken ct)
              {
                  if (edits.Count == 0)
                  {
                      return;
                  }

                  await using var cmd = new NpgsqlCommand(ApplySql.UpdateEdits, connection, transaction);
                  cmd.Parameters.Add(BigintArray("ids", edits.Select(e => e.Id).ToArray()));
                  cmd.Parameters.Add(TextArray("nodeValues", edits.Select(e => e.Value).ToArray()));
                  await cmd.ExecuteNonQueryAsync(ct);
              }

              private static async Task CascadeDeleteAsync(
                  NpgsqlConnection connection,
                  NpgsqlTransaction transaction,
                  IReadOnlyList<long> deleteIds,
                  CancellationToken ct)
              {
                  if (deleteIds.Count == 0)
                  {
                      return;
                  }

                  await using var cmd = new NpgsqlCommand(ApplySql.CascadeDelete, connection, transaction);
                  cmd.Parameters.Add(BigintArray("ids", deleteIds.ToArray()));
                  await cmd.ExecuteNonQueryAsync(ct);
              }

              private static async Task<List<NodeDetailsDto>> LoadNodeDetailsAsync(
                  NpgsqlConnection connection,
                  NpgsqlTransaction transaction,
                  long[] ids,
                  CancellationToken ct)
              {
                  var nodes = new List<NodeDetailsDto>(ids.Length);
                  if (ids.Length == 0)
                  {
                      return nodes;
                  }

                  await using var cmd = new NpgsqlCommand(ApplySql.LoadNodeDetails, connection, transaction);
                  cmd.Parameters.Add(BigintArray("ids", ids));
                  await using var reader = await cmd.ExecuteReaderAsync(ct);
                  while (await reader.ReadAsync(ct))
                  {
                      long? parentId = reader.IsDBNull(1) ? null : reader.GetInt64(1);
                      nodes.Add(new NodeDetailsDto(
                          reader.GetInt64(0),
                          parentId,
                          reader.GetString(2),
                          reader.GetBoolean(3),
                          reader.GetBoolean(4),
                          reader.GetFieldValue<long[]>(5)));
                  }

                  return nodes;
              }

              private static NpgsqlParameter BigintArray(string name, long[] values) =>
                  new(name, NpgsqlDbType.Array | NpgsqlDbType.Bigint) { Value = values };

              private static NpgsqlParameter TextArray(string name, string[] values) =>
                  new(name, NpgsqlDbType.Array | NpgsqlDbType.Text) { Value = values };
          }
    done_when:
      - The three files have exactly the content above and compile without warnings.

  - id: 6
    title: Apply endpoint (replaces the 501 stub) and Program.cs registration
    files:
      - { path: backend/src/TreeEditor.Api/Features/Apply/ApplyEndpoints.cs, action: replace }
      - { path: backend/src/TreeEditor.Api/Program.cs, action: replace }
    instructions:
      - path: backend/src/TreeEditor.Api/Features/Apply/ApplyEndpoints.cs
        content: |
          using System.Text.Json;
          using Microsoft.Extensions.Options;
          using HttpJsonOptions = Microsoft.AspNetCore.Http.Json.JsonOptions;

          namespace TreeEditor.Api.Features.Apply;

          public static class ApplyEndpoints
          {
              public static IEndpointRouteBuilder MapApplyEndpoints(this IEndpointRouteBuilder app)
              {
                  var group = app.MapGroup("/api/nodes");
                  group.MapPost("/apply", ApplyAsync);
                  return app;
              }

              // The body is read manually (no [FromBody]) so that a missing, empty or malformed body with any
              // or no Content-Type yields 400 ValidationProblemDetails with key "body" instead of 415/plain 400.
              private static async Task<IResult> ApplyAsync(
                  HttpRequest httpRequest,
                  ApplyService service,
                  IOptions<HttpJsonOptions> jsonOptions,
                  CancellationToken ct)
              {
                  ApplyRequest? request;
                  try
                  {
                      request = await JsonSerializer.DeserializeAsync<ApplyRequest>(
                          httpRequest.Body,
                          jsonOptions.Value.SerializerOptions,
                          ct);
                  }
                  catch (JsonException ex)
                  {
                      return ApplyProblems.Validation(new Dictionary<string, string[]>
                      {
                          ["body"] = new[] { $"Request body is not a valid ApplyRequest JSON object: {ex.Message}" },
                      });
                  }

                  if (request is null)
                  {
                      return ApplyProblems.Validation(new Dictionary<string, string[]>
                      {
                          ["body"] = new[] { "Request body is required." },
                      });
                  }

                  if (!ApplyValidator.TryValidate(request, out var command, out var errors))
                  {
                      return ApplyProblems.Validation(errors);
                  }

                  var outcome = await service.ApplyAsync(command, ct);
                  return outcome switch
                  {
                      ApplyOutcome.Success success => Results.Ok(success.Response),
                      ApplyOutcome.NotFound notFound => ApplyProblems.NotFound(notFound.NodeIds),
                      ApplyOutcome.Conflict conflict => ApplyProblems.Conflict(conflict.NodeIds),
                      _ => throw new InvalidOperationException($"Unhandled apply outcome {outcome.GetType().Name}."),
                  };
              }
          }
      - path: backend/src/TreeEditor.Api/Program.cs
        content: |
          using System.Text.Json;
          using Microsoft.EntityFrameworkCore;
          using TreeEditor.Api.Data;
          using TreeEditor.Api.Features.Apply;
          using TreeEditor.Api.Features.Health;
          using TreeEditor.Api.Features.Nodes;
          using TreeEditor.Api.Features.Reset;

          var builder = WebApplication.CreateBuilder(args);

          builder.Services.AddProblemDetails();
          builder.Services.ConfigureHttpJsonOptions(options =>
          {
              options.SerializerOptions.PropertyNamingPolicy = JsonNamingPolicy.CamelCase;
          });

          // Connection string is resolved lazily so test hosts can override it via UseSetting.
          builder.Services.AddDbContext<TreeDbContext>((services, options) =>
          {
              var connectionString = services.GetRequiredService<IConfiguration>().GetConnectionString("Default")
                  ?? throw new InvalidOperationException("Connection string 'ConnectionStrings:Default' is not configured.");
              options.UseNpgsql(connectionString);
          });
          builder.Services.AddScoped<TreeSeeder>();
          builder.Services.AddScoped<ApplyService>();

          var app = builder.Build();

          app.UseExceptionHandler();
          app.UseStatusCodePages();

          await DatabaseInitializer.InitializeAsync(app.Services, app.Lifetime.ApplicationStopping);

          app.MapHealthEndpoints();
          app.MapNodeEndpoints();
          app.MapResetEndpoints();
          app.MapApplyEndpoints();

          app.Run();

          public partial class Program
          {
          }
