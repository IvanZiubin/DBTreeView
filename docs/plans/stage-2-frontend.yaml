stage: 2
stage_name: base-structure
project: frontend

scope:
  implementer_may_write: [frontend/]
  never_write: [backend/, docker-compose.yml, docs/, CLAUDE.md, README.md, frontend/CLAUDE.md]
  notes: >
    frontend/CLAUDE.md is created later by docs-and-tests (workflow step 8), not by the implementer.
    No frontend test framework is set up in stage 2 (explicitly NOT required); Vitest arrives in stage 3.

