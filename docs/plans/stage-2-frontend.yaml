      cwd: /Users/maczone/Desktop/personal/test_qit/frontend
      command: source ~/.nvm/nvm.sh && nvm use 22 >/dev/null && npm install --save-exact primevue@4.3.3 @primeuix/themes@1.0.3 primeicons@7.0.0 pinia@3.0.2
      expect: 'package.json "dependencies" contains "primevue": "4.3.3", "@primeuix/themes": "1.0.3", "primeicons": "7.0.0", "pinia": "3.0.2"'
    - id: P5
