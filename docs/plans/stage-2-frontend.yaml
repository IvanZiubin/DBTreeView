      command: source ~/.nvm/nvm.sh && nvm use 22 >/dev/null && npm run build
      expect: exit 0 (unmodified template builds)

conventions_for_implementer:
  - Node commands always use the nvm prefix shown at the top of this file.
  - The template tsconfig enables noUnusedLocals, noUnusedParameters, erasableSyntaxOnly and verbatimModuleSyntax. Therefore: no enums, no constructor parameter properties, type-only imports use `import type` (or inline `type`), unused stub parameters are prefixed with `_`.
  - Use relative imports only (no `@/` alias).
  - All HTTP goes through src/api/client.ts. No other file calls fetch.
  - Never add CORS headers or configuration anywhere.
  - File contents given under `content` are to be written exactly (whitespace may differ only in trailing newline).
  - Do not modify package.json dependencies, scripts, tsconfig*.json, or files not listed in steps.

