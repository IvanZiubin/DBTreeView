      precondition: directory /Users/maczone/Desktop/personal/test_qit/frontend does NOT exist
      command: source ~/.nvm/nvm.sh && nvm use 22 >/dev/null && npx --yes create-vite@6.5.0 frontend --template vue-ts
      expect: frontend/package.json, frontend/vite.config.ts, frontend/src/main.ts exist
