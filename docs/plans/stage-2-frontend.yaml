  - id: S3
    title: API types mirroring the contract
    files:
      - { path: frontend/src/api/types.ts, action: create }
    content: |
      // Mirrors schemas in docs/ai/api-contract.yaml. Keep in sync with the contract; never diverge.

      /** Contract schema `Node`. */
      export interface Node {
        id: number
        parentId: number | null
        value: string
        isDeleted: boolean
        hasChildren: boolean
      }

      /** Contract schema `NodeDetails`: Node plus ancestor ids ordered root -> parent ([] for a root). */
      export interface NodeDetails extends Node {
        ancestorIds: number[]
      }

      export interface ApplyEdit {
        id: number
        value: string
      }

      /** Exactly one of parentId / parentTempId is set. */
      export interface ApplyAdd {
        tempId: string
        parentId?: number | null
        parentTempId?: string | null
        value: string
      }

      /** Contract schema `ApplyRequest`. */
      export interface ApplyRequest {
        edits: ApplyEdit[]
        adds: ApplyAdd[]
        deletes: number[]
        refreshIds?: number[]
      }

      /** Contract schema `ApplyResponse`. idMap: tempId -> real id. */
      export interface ApplyResponse {
        idMap: Record<string, number>
        nodes: NodeDetails[]
      }

      /** RFC 7807 ProblemDetails; `errors` present for ValidationProblemDetails. */
      export interface ProblemDetails {
        type?: string
        title?: string
        status?: number
        detail?: string
        instance?: string
        errors?: Record<string, string[]>
      }

      /** GET /api/health 200 body. */
      export interface HealthResponse {
        status: string
      }
    done_when: File matches content.

  - id: S4
    title: Typed fetch client with ApiError
    files:
      - { path: frontend/src/api/client.ts, action: create }
    content: |
      import type {
        ApplyRequest,
        ApplyResponse,
        HealthResponse,
        Node,
        NodeDetails,
        ProblemDetails,
      } from './types'

      const BASE_PATH = '/api'

      /** Thrown for every non-2xx response (status = HTTP status) and for network failures (status = 0). */
      export class ApiError extends Error {
        readonly status: number
        readonly problem: ProblemDetails | null

        constructor(status: number, problem: ProblemDetails | null, fallbackMessage: string) {
          super(problem?.detail ?? problem?.title ?? fallbackMessage)
          this.name = 'ApiError'
          this.status = status
          this.problem = problem
        }

        /** ProblemDetails title, or a generic title when the body was not ProblemDetails. */
        get title(): string {
          return this.problem?.title ?? `Request failed (HTTP ${this.status})`
        }

        /** ProblemDetails detail plus flattened validation errors, or the error message. */
        get detail(): string {
          const parts: string[] = []
          if (this.problem?.detail) {
            parts.push(this.problem.detail)
          }
          const errors = this.problem?.errors
          if (errors) {
            for (const [field, messages] of Object.entries(errors)) {
              parts.push(`${field}: ${messages.join(', ')}`)
            }
          }
          return parts.length > 0 ? parts.join('; ') : this.message
        }
      }

      type HttpMethod = 'GET' | 'POST'

      async function request<T>(method: HttpMethod, path: string, body?: unknown): Promise<T> {
        const headers: Record<string, string> = { Accept: 'application/json' }
        if (body !== undefined) {
          headers['Content-Type'] = 'application/json'
        }

        let response: Response
        try {
          response = await fetch(`${BASE_PATH}${path}`, {
            method,
            headers,
            body: body === undefined ? undefined : JSON.stringify(body),
          })
        } catch {
          throw new ApiError(
            0,
            { title: 'Network error', detail: 'The API could not be reached.' },
            'Network error',
          )
        }

        if (!response.ok) {
          let problem: ProblemDetails | null = null
          const text = await response.text()
          if (text) {
            try {
              problem = JSON.parse(text) as ProblemDetails
            } catch {
              problem = null
            }
          }
          throw new ApiError(response.status, problem, `${method} ${BASE_PATH}${path} failed with HTTP ${response.status}`)
        }

        return (await response.json()) as T
      }

      /** GET /api/health */
      export function getHealth(): Promise<HealthResponse> {
        return request<HealthResponse>('GET', '/health')
      }

      /** GET /api/nodes/roots */
      export function getRoots(): Promise<Node[]> {
        return request<Node[]>('GET', '/nodes/roots')
      }

      /** GET /api/nodes/{id}/children — direct children only. */
      export function getChildren(id: number): Promise<Node[]> {
        return request<Node[]>('GET', `/nodes/${id}/children`)
      }

      /** GET /api/nodes/{id} — single node with ancestorIds. */
      export function getNode(id: number): Promise<NodeDetails> {
        return request<NodeDetails>('GET', `/nodes/${id}`)
      }

      /** POST /api/reset — returns roots after reset. */
      export function resetDatabase(): Promise<Node[]> {
        return request<Node[]>('POST', '/reset')
      }

      /** POST /api/nodes/apply — returns 501 in stage 2; not called until stage 3. */
      export function applyChanges(body: ApplyRequest): Promise<ApplyResponse> {
        return request<ApplyResponse>('POST', '/nodes/apply', body)
      }
    done_when: File matches content.

  - id: S5
    title: Central error reporting to Toast
    files:
      - { path: frontend/src/errors.ts, action: create }
    content: |
      import type { useToast } from 'primevue/usetoast'
      import { ApiError } from './api/client'

      type ToastApi = ReturnType<typeof useToast>

      let toastApi: ToastApi | null = null

      /** Called once from App.vue setup with useToast(). */
      export function installErrorToast(toast: ToastApi): void {
        toastApi = toast
      }

      export function describeError(err: unknown): { summary: string; detail: string } {
        if (err instanceof ApiError) {
          return { summary: err.title, detail: err.detail }
        }
        if (err instanceof Error) {
          return { summary: 'Unexpected error', detail: err.message }
        }
        return { summary: 'Unexpected error', detail: String(err) }
      }

      /** Logs the error and shows an error toast with ProblemDetails title/detail. */
      export function reportError(err: unknown): void {
        console.error(err)
        const { summary, detail } = describeError(err)
        toastApi?.add({ severity: 'error', summary, detail, life: 6000 })
      }
    done_when: File matches content.

  - id: S6
    title: DB tree Pinia store (lazy loading)
    files:
      - { path: frontend/src/stores/dbTree.ts, action: create }
    content: |
      import { defineStore } from 'pinia'
      import { computed, ref } from 'vue'
      import type { TreeNode } from 'primevue/treenode'
      import { getChildren, getRoots } from '../api/client'
      import type { Node } from '../api/types'

      /** Maps an API node to a PrimeVue TreeNode. Children are loaded lazily. */
      export function toTreeNode(node: Node): TreeNode {
        return {
          key: String(node.id),
          label: node.value,
          leaf: !node.hasChildren,
          loading: false,
          data: node,
        }
      }

      function findTreeNode(nodes: TreeNode[], key: string): TreeNode | null {
        for (const node of nodes) {
          if (node.key === key) {
            return node
          }
          if (node.children) {
            const found = findTreeNode(node.children, key)
            if (found) {
              return found
            }
          }
        }
        return null
      }

      export const useDbTreeStore = defineStore('dbTree', () => {
        const roots = ref<TreeNode[]>([])
        const rootsLoading = ref(false)
        const expandedKeys = ref<Record<string, boolean>>({})
        const selectionKeys = ref<Record<string, boolean>>({})
        /** Keys whose children have been fetched; re-expanding never refetches. */
        const loadedKeys = ref<Record<string, boolean>>({})
        /** Incremented by setRoots(); late children responses from an older tree are discarded. */
        let generation = 0

        const selectedId = computed<number | null>(() => {
          const key = Object.keys(selectionKeys.value).find((k) => selectionKeys.value[k])
          return key === undefined ? null : Number(key)
        })

        const selectedNode = computed<Node | null>(() => {
          if (selectedId.value === null) {
            return null
          }
          const treeNode = findTreeNode(roots.value, String(selectedId.value))
          return treeNode ? (treeNode.data as Node) : null
        })

        /** Replaces the whole tree with fresh roots and clears expansion/selection state. */
        function setRoots(nodes: Node[]): void {
          generation += 1
          roots.value = nodes.map(toTreeNode)
          expandedKeys.value = {}
          selectionKeys.value = {}
          loadedKeys.value = {}
        }

        async function loadRoots(): Promise<void> {
          rootsLoading.value = true
          try {
            setRoots(await getRoots())
          } finally {
            rootsLoading.value = false
          }
        }

        /** Loads one level of children for the node with the given key (called on node-expand). */
        async function loadChildren(key: string): Promise<void> {
          if (loadedKeys.value[key]) {
            return
          }
          const target = findTreeNode(roots.value, key)
          if (!target || target.leaf || target.loading) {
            return
          }
          const startedGeneration = generation
          target.loading = true
          try {
            const children = await getChildren(Number(key))
            if (startedGeneration !== generation) {
              return
            }
            target.children = children.map(toTreeNode)
            target.leaf = children.length === 0
            loadedKeys.value[key] = true
          } catch (err) {
            if (startedGeneration === generation) {
              delete expandedKeys.value[key]
            }
            throw err
          } finally {
            target.loading = false
          }
        }

        return {
          roots,
          rootsLoading,
          expandedKeys,
          selectionKeys,
          selectedId,
          selectedNode,
          setRoots,
          loadRoots,
          loadChildren,
        }
      })
    done_when: File matches content.

  - id: S7
    title: Cache Pinia store skeleton (logic arrives in stages 3-4)
    files:
      - { path: frontend/src/stores/cache.ts, action: create }
    content: |
      import { defineStore } from 'pinia'
      import { computed, ref } from 'vue'
      import type { TreeNode } from 'primevue/treenode'
      import type { NodeDetails } from '../api/types'

      /** Real ids are numbers; temp ids (nodes added in the cache, not yet applied) are strings "tmp-<n>". */
      export type CacheId = number | string

      export interface CachedNode {
        id: CacheId
        parentId: CacheId | null
        /** Current (possibly edited) value. */
        value: string
        /** Value as last loaded from / applied to the DB ('' for new nodes). */
        originalValue: string
        /** Deleted state in the DB as of the last load/apply. */
        isDeleted: boolean
        /** Added in the cache, not yet applied (id is a temp id). */
        isNew: boolean
        /** Value edited in the cache, not yet applied. */
        isEdited: boolean
        /** Marked deleted in the cache (directly or by cascade), not yet applied. */
        isPendingDelete: boolean
        /** Ancestor ids ordered root -> parent. */
        ancestorIds: CacheId[]
      }

      /** Map key for a cache id: String(id). Real "42" and temp "tmp-1" never collide. */
      export function cacheKey(id: CacheId): string {
        return String(id)
      }

      export const useCacheStore = defineStore('cache', () => {
        const nodes = ref<Record<string, CachedNode>>({})
        const selectedKey = ref<string | null>(null)
        const nextTempSeq = ref(1)
        const applying = ref(false)

        const nodeList = computed<CachedNode[]>(() => Object.values(nodes.value))

        const isEmpty = computed<boolean>(() => Object.keys(nodes.value).length === 0)

        const selectedNode = computed<CachedNode | null>(() =>
          selectedKey.value === null ? null : (nodes.value[selectedKey.value] ?? null),
        )

        const hasPendingChanges = computed<boolean>(() =>
          nodeList.value.some((n) => n.isNew || n.isEdited || n.isPendingDelete),
        )

        /** Hierarchy assembled from cached nodes. TODO stage 3: assemble using parentId/ancestorIds. */
        const treeNodes = computed<TreeNode[]>(() => [])

        /** TODO stage 3: insert/refresh a node loaded from GET /api/nodes/{id}. */
        function loadNode(_details: NodeDetails): void {
          // Intentionally empty in stage 2.
        }

        /** TODO stage 4: change value of a non-deleted node; mark isEdited. */
        function editValue(_id: CacheId, _value: string): void {
          // Intentionally empty in stage 2.
        }

        /** TODO stage 4: add a child with a new temp id under a non-deleted node. */
        function addChild(_parentId: CacheId, _value: string): void {
          // Intentionally empty in stage 2.
        }

        /** TODO stage 4: mark the node and all cached descendants as pending-deleted. */
        function deleteNode(_id: CacheId): void {
          // Intentionally empty in stage 2.
        }

        /** TODO stage 3/4: build ApplyRequest, POST /api/nodes/apply, map temp ids, resync. */
        async function apply(): Promise<void> {
          // Intentionally empty in stage 2.
        }

        /** Empties the cache (used by Reset). */
        function clear(): void {
          nodes.value = {}
          selectedKey.value = null
          nextTempSeq.value = 1
          applying.value = false
        }

        return {
          nodes,
          selectedKey,
          nextTempSeq,
          applying,
          nodeList,
          isEmpty,
          selectedNode,
          hasPendingChanges,
          treeNodes,
          loadNode,
          editValue,
          addChild,
          deleteNode,
          apply,
          clear,
        }
      })
    done_when: File matches content.

