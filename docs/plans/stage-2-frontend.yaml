  - id: S11
    title: AppHeader component (title + Reset with confirm)
    files:
      - { path: frontend/src/components/AppHeader.vue, action: create }
    content: |
      <script setup lang="ts">
      import { ref } from 'vue'
      import Button from 'primevue/button'
      import { useConfirm } from 'primevue/useconfirm'
      import { useToast } from 'primevue/usetoast'
      import { resetDatabase } from '../api/client'
      import { reportError } from '../errors'
      import { useCacheStore } from '../stores/cache'
      import { useDbTreeStore } from '../stores/dbTree'

      const confirm = useConfirm()
      const toast = useToast()
      const dbTree = useDbTreeStore()
      const cache = useCacheStore()
      const resetting = ref(false)

      async function doReset(): Promise<void> {
        resetting.value = true
        try {
          const roots = await resetDatabase()
          dbTree.setRoots(roots)
          cache.clear()
          toast.add({
            severity: 'success',
            summary: 'Reset complete',
            detail: 'Database restored to the sample data; cache cleared.',
            life: 3000,
          })
        } catch (err) {
          reportError(err)
        } finally {
          resetting.value = false
        }
      }

      function onResetClick(): void {
        confirm.require({
          header: 'Reset database',
          message:
            'Restore the database to the initial sample data and clear the cache? Unapplied cache changes will be lost.',
          icon: 'pi pi-exclamation-triangle',
          rejectProps: { label: 'Cancel', severity: 'secondary', outlined: true },
          acceptProps: { label: 'Reset', severity: 'danger' },
          accept: () => {
            void doReset()
          },
        })
      }
      </script>

      <template>
        <header class="app-header">
          <h1 class="app-header__title">Tree Editor</h1>
          <Button
            label="Reset"
            icon="pi pi-refresh"
            severity="danger"
            :loading="resetting"
            data-testid="reset-button"
            @click="onResetClick"
          />
        </header>
      </template>

      <style scoped>
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        background: var(--p-content-background);
        border-bottom: 1px solid var(--p-content-border-color);
      }

      .app-header__title {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 600;
      }
      </style>
    done_when: File matches content.

  - id: S12
    title: DbTreeView component (lazy PrimeVue Tree + Load into cache)
    files:
      - { path: frontend/src/components/DbTreeView.vue, action: create }
    content: |
      <script setup lang="ts">
      import { onMounted, ref } from 'vue'
      import Button from 'primevue/button'
      import Tree from 'primevue/tree'
      import type { TreeNode } from 'primevue/treenode'
      import { useToast } from 'primevue/usetoast'
      import NodeLabel from './NodeLabel.vue'
      import { getNode } from '../api/client'
      import type { Node } from '../api/types'
      import { reportError } from '../errors'
      import { useCacheStore } from '../stores/cache'
      import { useDbTreeStore } from '../stores/dbTree'

      const dbTree = useDbTreeStore()
      const cache = useCacheStore()
      const toast = useToast()
      const loadingIntoCache = ref(false)

      onMounted(async () => {
        try {
          await dbTree.loadRoots()
        } catch (err) {
          reportError(err)
        }
      })

      async function onNodeExpand(node: TreeNode): Promise<void> {
        try {
          await dbTree.loadChildren(node.key)
        } catch (err) {
          reportError(err)
        }
      }

      async function onLoadIntoCache(): Promise<void> {
        const id = dbTree.selectedId
        if (id === null) {
          return
        }
        loadingIntoCache.value = true
        try {
          const details = await getNode(id)
          cache.loadNode(details)
          // TODO stage 3: replace this toast once the cache store implements loadNode.
          toast.add({
            severity: 'info',
            summary: 'Not available yet',
            detail: 'Cache loading arrives in stage 3',
            life: 3000,
          })
        } catch (err) {
          reportError(err)
        } finally {
          loadingIntoCache.value = false
        }
      }

      function nodeData(node: TreeNode): Node {
        return node.data as Node
      }
      </script>

      <template>
        <section class="tree-panel" data-testid="db-tree-view">
          <header class="tree-panel__header">
            <h2 class="tree-panel__title">Database</h2>
            <Button
              label="Load into cache"
              icon="pi pi-download"
              size="small"
              :disabled="dbTree.selectedId === null"
              :loading="loadingIntoCache"
              data-testid="load-into-cache"
              @click="onLoadIntoCache"
            />
          </header>
          <div class="tree-panel__body">
            <Tree
              v-model:selection-keys="dbTree.selectionKeys"
              v-model:expanded-keys="dbTree.expandedKeys"
              :value="dbTree.roots"
              selection-mode="single"
              :meta-key-selection="false"
              loading-mode="icon"
              :loading="dbTree.rootsLoading"
              class="tree-panel__tree"
              @node-expand="onNodeExpand"
            >
              <template #default="{ node }">
                <NodeLabel :value="nodeData(node).value" :deleted="nodeData(node).isDeleted" />
              </template>
            </Tree>
            <p v-if="!dbTree.rootsLoading && dbTree.roots.length === 0" class="tree-panel__empty">
              No nodes in the database.
            </p>
          </div>
        </section>
      </template>
    done_when: File matches content.

