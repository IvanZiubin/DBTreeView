  - id: S16
    title: nginx config (SPA fallback + /api proxy)
    files:
      - { path: frontend/nginx.conf, action: create }
    content: |
      server {
          listen 80;
          server_name _;

          root /usr/share/nginx/html;
          index index.html;

          # Docker embedded DNS; variable upstream lets nginx start even if "api" is not resolvable yet.
          resolver 127.0.0.11 valid=10s ipv6=off;
          set $api_upstream http://api:8080;

          # Same-origin API: /api/* is forwarded unchanged to http://api:8080/api/*. No CORS.
          location /api/ {
              proxy_pass $api_upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
          }

          location /assets/ {
              try_files $uri =404;
              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          location / {
              try_files $uri $uri/ /index.html;
              add_header Cache-Control "no-cache";
          }
      }
    done_when: File matches content.

